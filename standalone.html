           \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认：与品牌部确认展会基本信息(规模/展位尺寸/主题/预算)  →  2. 设计方案制定：制定展会/活动整体视觉设计方案(展位设计/物料清单)  →  3. 设计稿件输出：完成展会所有视觉设计稿件(背景墙/宣传折页/招贴立牌等)  →  4. 方案评审确认：组织品牌部/领导层设计方案评审，确认最终方案\n                              ↓                              \n8. 搭建安装执行：展前完成展位搭建和物料安装  ←  7. 物料到货验收：物料到货后验收质量和数量，确认无误  ←  6. 物料制作跟进：跟进物料制作进度(制作工期久的每周跟进，短的2-3天跟进)  ←  5. 物料供应商筛选：筛选物料制作供应商，进行询价比价\n                              ↓                              \n9. 现场效果确认：开展当日检查整体视觉效果，确保品牌形象完整呈现  →  10. 撤展与物料回收：展会结束后撤展和可回收物料整理  →  11. 费用核算归档：完成展会费用核算、供应商评价、设计素材归档  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n产品策划 | DS-SOP-6 | 新品详情页标准内容制作 | 【流程说明】新品上市前产品详情页内容的标准制定和制作流程\n\n1. 新品信息获取：从产品经理获取新品完整信息(配方/功效/成分/定位/定价)  →  2. 竞品内容分析：收集对标竞品的详情页内容表达模式和卖点宣称  →  3. 产品卖点提炼：与研发/产品经理沟通确认核心卖点和技术支撑点  →  4. 内容方案制定：制定产品详情页内容方案(产品介绍/功效说明/成分解读/使用场景)\n                              ↓                              \n8. 设计稿件审核：审核设计稿中的产品信息、功效表达是否准确无误  ←  7. 设计方案输出：向设计团队输出详情页设计方案和设计要求  ←  6. 文案撰写优化：撰写产品详情页文案，确保表述妥当、违禁词0  ←  5. 法规合规检查：对照《化妆品功效宣称评价规范》检查卖点表述合规性\n                              ↓                              \n9. 多部门确认：与研发/产品经理/运营沟通确认内容无误、表述妥当  →  10. 上架检查：上架后检查详情页在产品详情页的实际展示效果  →  11. 效果跟踪优化：跟踪详情页转化率，根据数据反馈持续优化内容  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌内容策划 / 摄像岗 / 摄影岗 | DS-SOP-7 | 品牌视频/摄影项目全流程制作 | 【流程说明】品牌视频和摄影项目从创意到成品的标准化全流程管理\n\n1. 需求对接确认：与品牌部/产品经理确认视频/摄影项目需求和交付标准  →  2. 创意方案策划：策划创意方案(拍摄主题/视觉风格/分镜脚本)  →  3. 方案评审确认：提交创意方案给需求方评审确认  →  4. 拍摄方案设计：设计详细拍摄方案(场地/灯光/道具/模特/服装)\n                              ↓                              \n8. 甲方审核修改：提交初稿给需求方审核，根据反馈修改  ←  7. 后期制作处理：视频剪辑/调色/特效/配音(3天后期制作)  ←  6. 正式拍摄执行：按拍摄方案执行拍摄(2天中期拍摄)  ←  5. 拍摄准备执行：准备拍摄所需设备和物料(3天前期准备)\n                              ↓                              \n9. 终稿确认交付：需求方终审确认后交付最终成品  →  10. 项目复盘归档：完成项目复盘，归档制作文件和经验  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）", "kpiStandards": "视觉负责人 | 团队设计产出量 | ≥月度目标 | 每月 | 设计团队月度完成设计稿件总数量\n设计需求满足率 | ≥95% | 每周 | 按时完成的设计需求/总设计需求\n设计质量合格率 | ≥98% | 每月 | 审核通过无重大问题的设计稿件占比\n设计稿件返工率 | ≤10% | 每月 | 因质量问题需要重做的设计稿占比\n全渠道视觉统一率 | ≥95% | 每月 | 全渠道视觉输出符合VI规范的比例\n渠道设计师 | 日常设计按时交付率 | ≥95% | 每日 | 24h内完成的日常设计需求比例\n设计出错率 | 0% | 每月 | 全渠道平台设计出错次数(违禁词/信息错误)\n页面完成率 | 100% | 按需求 | 运营提交的页面设计需求完成比例\n达人主图完成率 | 100% | 按需求 | 达人专场直播主图按时完成比例\n大促视觉按时完成率 | 100% | 每场大促 | 大促活动所有视觉素材按时交付\n品牌设计师 | 品牌VI规范执行率 | 100% | 每月 | 品牌物料设计符合VI规范的比例\n物料设计按时交付率 | ≥95% | 每周 | 品牌物料按排期完成设计的比例\n展会物料出错率 | 0% | 每场展会 | 展会相关设计稿信息和规格出错次数\n微博公众号视觉交付率 | 100% | 每周 | 微博周更3-4张海报+公众号月更视觉按时交付\nAI设计师 | AI工具产出效率提升 | ≥30% | 每月 | 使用AI工具相比传统设计方式的效率提升比例\nAI素材可用率 | ≥80% | 每周 | AI生成的素材中可直接使用的比例\n产品策划 | 新品内容准备及时率 | 100% | 按新品 | 新品提前2个月完成内容准备的比例\n违禁词检测通过率 | 100% | 每周 | 每周排查中未发现违禁词的比例\n运营需求响应及时率 | ≥90% | 每周 | 运营提出的产品内容需求按时完成比例\n品牌内容策划 | 视频脚本按时交付率 | 100% | 按项目 | 视频创意脚本按时输出给拍摄团队的比例\n视频传播效果达成率 | ≥80% | 每月 | 品牌视频内容传播效果达成预设目标的比例\n摄像岗 | 月度视频产出量 | ≥5个/月 | 每月 | 每月产出日常品宣和节日主题视频数量\n视频素材可用率 | ≥95% | 每周 | 拍摄素材中可直接用于后期制作的比例\n拍摄按时完成率 | 100% | 按项目 | 按约定时间完成拍摄任务的比例\n摄影岗 | 产品图片月度产出量 | ≥月度目标 | 每月 | 月度完成产品静物摄影拍摄张数\n拍摄图片合格率 | ≥98% | 每周 | 拍摄图片通过后期审核的合格比例"}, "count": 0, "people": []}, {"name": "产品策划", "details": {"jobResponsibilities": "产品详情页标准规范制定\n以单品形式制定输出内容规范，为各渠道人员提供准确的产品内容；新品至少提前2个月准备相关内容与研发/产品经理/运营沟通确认\n\n产品内容表达与视觉优化\n以消费者为中心收集整理行业市场竞品的产品内容表达模式和卖点宣称；每日跟进竞品店铺详情页并及时优化\n\n渠道运营需求内容配合\n以渠道运营需求为中心配合输出直播大字报、种草BF等产品相关内容；积极与运营沟通及时完成内容输出\n\n产品功效表达合规管理\n时刻关注《化妆品功效宣称评价规范》，跟进检查店铺上架产品详情页及时调整；每周排查违禁词，重大活动提前2周排查", "jobRequirements": "专科及以上学历，2年以上产品内容/产品策划经验；熟悉化妆品行业法规和功效宣称规范；具备优秀的文案撰写和产品卖点提炼能力", "workProcess": "1 | 视觉负责人 | 每日 | 1. 晨会与需求梳理：主持设计团队晨会，梳理当日紧急需求和重点项目进度。2. 设计审核：审核当日产出的重点设计稿件（主图/首页/大促视觉）。3. 资源协调：根据各渠道需求紧急程度调配设计资源。4. 进度把控：检查各项目设计进度是否按排期推进\n2 | 视觉负责人 | 每周 | 1. 设计复盘：组织团队周会，复盘上周设计产出质量和效率。2. 需求排期：梳理下周渠道设计需求排期，分配任务。3. 设计规范检查：抽查各渠道视觉输出是否符合设计规范。4. 团队建设：与设计师一对一沟通，提升团队能力\n3 | 视觉负责人 | 每月 | 1. 月度设计复盘：输出月度设计产出统计和质量分析报告。2. 品牌VI更新：根据品牌发展评估和更新VI规范。3. 能力培训：组织设计团队技能培训和分享。4. 竞品视觉分析：分析竞品品牌视觉策略和设计趋势\n4 | 渠道设计师 | 每日 | 1. 需求执行：按排期完成当日运营提交的设计需求。2. 设计修改：配合运营修改已上线页面的视觉优化。3. 素材检查：检查上线素材的合规性和视觉呈现效果。4. 模板维护：更新和维护设计模板库\n5 | 渠道设计师 | 每周 | 1. 大促视觉准备：提前进行大促活动页面视觉设计。2. 竞品视觉分析：分析竞品店铺视觉策略和设计风格。3. 效果复盘：复盘上周设计稿的点击率和转化效果。4. 设计规范学习：学习和更新各平台最新设计规范\n6 | 渠道设计师 | 每月 | 1. 月度设计统计：统计月度产出设计数量和各渠道分布。2. 效果优化：根据数据反馈优化设计模板和视觉策略。3. 技能提升：学习新设计工具和设计趋势\n7 | 品牌设计师 | 每日 | 1. 品牌物料设计：按排期完成日常品牌物料设计需求。2. 微博海报：完成微博周更视觉海报设计。3. 设计修改：配合品牌内容修改和优化已有设计稿。4. VI规范检查：确保当日产出设计符合品牌VI规范\n8 | 品牌设计师 | 每周 | 1. 大促/活动视觉准备：提前进行品牌大促和活动视觉设计。2. 物料跟进：跟进制作中的品牌物料进度和质量。3. 设计复盘：复盘上周品牌视觉设计效果。4. VI规范优化：收集VI应用中的问题提出优化建议\n9 | 品牌设计师 | 每月 | 1. 公众号视觉：完成公众号月度1-2篇视觉设计。2. 品牌手册更新：根据品牌发展更新品牌手册设计。3. 展会物料：提前完成品牌展会所需视觉设计。4. 设计规范迭代：提交VI规范优化方案\n10 | AI设计师 | 每日 | 1. AI素材生成：运用AI工具生成设计所需的图文素材。2. AI视频处理：进行AI视频剪辑和后期特效制作。3. 工具研究：测试和试用最新的AI设计工具。4. 素材库维护：整理和归档AI生成的优质素材\n11 | AI设计师 | 每周 | 1. 效率提升报告：输出AI工具使用效率提升数据。2. 工具分享：向团队分享AI设计工具的使用技巧。3. 效果优化：优化AI提示词和工作流提升生成质量\n12 | AI设计师 | 每月 | 1. AI工具评估报告：输出月度AI设计工具评估和应用报告。2. 培训推广：组织AI设计工具培训推广。3. 趋势研究：跟踪AI设计领域最新发展\n13 | 产品策划 | 每日 | 1. 竞品详情页分析：跟进竞品店铺详情页，随看随记形成思维导图。2. 产品内容优化：优化产品详情页内容，提供对消费者有价值的内容。3. 运营需求响应：积极与运营沟通配合输出产品内容。4. 违禁词排查：日常排查页面违禁词\n14 | 产品策划 | 每周 | 1. 违禁词排查：每周排查页面违禁词，重大活动提前2周排查。2. 产品内容更新：根据新品上市计划更新产品详情页内容。3. 竞品分析更新：更新竞品内容分析思维导图。4. 渠道内容支持：输出直播大字报、种草BF等内容\n15 | 产品策划 | 每月 | 1. 新品内容准备：新品至少提前2个月准备相关内容并多方沟通确认。2. 内容规范更新：更新产品内容表达规范和标准。3. 合规检查报告：输出月度产品内容合规检查报告\n16 | 品牌内容策划 | 每日 | 1. 创意策划：策划品牌视频创意方案，输出视频脚本。2. 素材收集：收集视频制作所需参考素材和灵感。3. 项目跟进：跟进进行中的视频项目制作进度\n17 | 品牌内容策划 | 每周 | 1. 视频脚本撰写：根据品牌传播需求撰写视频脚本。2. 拍摄协调：与拍摄团队协调视频拍摄安排。3. 创意复盘：复盘已发布视频的传播效果，优化创意方向。4. 趋势追踪：收集分析品牌视频创意趋势\n18 | 品牌内容策划 | 每月 | 1. 月度视频规划：规划下月品牌视频内容选题和制作计划。2. 创意案例库更新：更新品牌视频创意案例库。3. 效果分析：分析月度视频内容传播效果\n19 | 摄像岗 | 每日 | 1. 拍摄执行：按排期完成当日视频拍摄任务。2. 设备检查：检查摄像机、灯光、收音设备状态。3. 素材导入：将拍摄素材导入电脑并备份。4. 现场清洁：清理拍摄场地和设备\n20 | 摄像岗 | 每周 | 1. 素材整理：按项目对拍摄素材分类命名归档。2. 设备保养：深度清洁和维护拍摄设备。3. 拍摄复盘：复盘拍素材质与剪辑团队沟通优化\n21 | 摄像岗 | 每月 | 1. 月度拍摄统计：统计月度拍摄视频数量和类型。2. 设备检修：对拍摄设备进行全面检修。3. 技能提升：学习新的拍摄技法和布光技巧\n22 | 摄影岗 | 每日 | 1. 产品拍摄：按排期完成当日产品静物拍摄。2. 图片处理：对拍摄照片进行后期调色修图处理。3. 素材归档：完成当日拍摄照片的分类归档\n23 | 摄影岗 | 每周 | 1. 拍摄方案设计：根据下周需求设计拍摄方案和场景。2. 设备保养：维护摄影器材和灯光设备。3. 素材整理：整理归档本周拍摄素材\n24 | 摄影岗 | 每月 | 1. 产品图片库更新：更新维护产品图片库。2. 拍摄质量复盘：复盘月度拍摄质量并进行优化。3. 设备维护：摄影器材深度维护", "workStandards": "视觉负责人 / 渠道设计师 | DS-SOP-1 | 电商大促全渠道视觉设计执行 | 【流程说明】涵盖天猫/京东/拼多多/抖音全渠道大促视觉方案的标准化执行流程\n\n1. 活动方案对接：接收运营端大促活动方案，明确活动主题、核心利益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认：与品牌部确认展会基本信息(规模/展位尺寸/主题/预算)  →  2. 设计方案制定：制定展会/活动整体视觉设计方案(展位设计/物料清单)  →  3. 设计稿件输出：完成展会所有视觉设计稿件(背景墙/宣传折页/招贴立牌等)  →  4. 方案评审确认：组织品牌部/领导层设计方案评审，确认最终方案\n                              ↓                              \n8. 搭建安装执行：展前完成展位搭建和物料安装  ←  7. 物料到货验收：物料到货后验收质量和数量，确认无误  ←  6. 物料制作跟进：跟进物料制作进度(制作工期久的每周跟进，短的2-3天跟进)  ←  5. 物料供应商筛选：筛选物料制作供应商，进行询价比价\n                              ↓                              \n9. 现场效果确认：开展当日检查整体视觉效果，确保品牌形象完整呈现  →  10. 撤展与物料回收：展会结束后撤展和可回收物料整理  →  11. 费用核算归档：完成展会费用核算、供应商评价、设计素材归档  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n产品策划 | DS-SOP-6 | 新品详情页标准内容制作 | 【流程说明】新品上市前产品详情页内容的标准制定和制作流程\n\n1. 新品信息获取：从产品经理获取新品完整信息(配方/功效/成分/定位/定价)  →  2. 竞品内容分析：收集对标竞品的详情页内容表达模式和卖点宣称  →  3. 产品卖点提炼：与研发/产品经理沟通确认核心卖点和技术支撑点  →  4. 内容方案制定：制定产品详情页内容方案(产品介绍/功效说明/成分解读/使用场景)\n                              ↓                              \n8. 设计稿件审核：审核设计稿中的产品信息、功效表达是否准确无误  ←  7. 设计方案输出：向设计团队输出详情页设计方案和设计要求  ←  6. 文案撰写优化：撰写产品详情页文案，确保表述妥当、违禁词0  ←  5. 法规合规检查：对照《化妆品功效宣称评价规范》检查卖点表述合规性\n                              ↓                              \n9. 多部门确认：与研发/产品经理/运营沟通确认内容无误、表述妥当  →  10. 上架检查：上架后检查详情页在产品详情页的实际展示效果  →  11. 效果跟踪优化：跟踪详情页转化率，根据数据反馈持续优化内容  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌内容策划 / 摄像岗 / 摄影岗 | DS-SOP-7 | 品牌视频/摄影项目全流程制作 | 【流程说明】品牌视频和摄影项目从创意到成品的标准化全流程管理\n\n1. 需求对接确认：与品牌部/产品经理确认视频/摄影项目需求和交付标准  →  2. 创意方案策划：策划创意方案(拍摄主题/视觉风格/分镜脚本)  →  3. 方案评审确认：提交创意方案给需求方评审确认  →  4. 拍摄方案设计：设计详细拍摄方案(场地/灯光/道具/模特/服装)\n                              ↓                              \n8. 甲方审核修改：提交初稿给需求方审核，根据反馈修改  ←  7. 后期制作处理：视频剪辑/调色/特效/配音(3天后期制作)  ←  6. 正式拍摄执行：按拍摄方案执行拍摄(2天中期拍摄)  ←  5. 拍摄准备执行：准备拍摄所需设备和物料(3天前期准备)\n                              ↓                              \n9. 终稿确认交付：需求方终审确认后交付最终成品  →  10. 项目复盘归档：完成项目复盘，归档制作文件和经验  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）", "kpiStandards": "视觉负责人 | 团队设计产出量 | ≥月度目标 | 每月 | 设计团队月度完成设计稿件总数量\n设计需求满足率 | ≥95% | 每周 | 按时完成的设计需求/总设计需求\n设计质量合格率 | ≥98% | 每月 | 审核通过无重大问题的设计稿件占比\n设计稿件返工率 | ≤10% | 每月 | 因质量问题需要重做的设计稿占比\n全渠道视觉统一率 | ≥95% | 每月 | 全渠道视觉输出符合VI规范的比例\n渠道设计师 | 日常设计按时交付率 | ≥95% | 每日 | 24h内完成的日常设计需求比例\n设计出错率 | 0% | 每月 | 全渠道平台设计出错次数(违禁词/信息错误)\n页面完成率 | 100% | 按需求 | 运营提交的页面设计需求完成比例\n达人主图完成率 | 100% | 按需求 | 达人专场直播主图按时完成比例\n大促视觉按时完成率 | 100% | 每场大促 | 大促活动所有视觉素材按时交付\n品牌设计师 | 品牌VI规范执行率 | 100% | 每月 | 品牌物料设计符合VI规范的比例\n物料设计按时交付率 | ≥95% | 每周 | 品牌物料按排期完成设计的比例\n展会物料出错率 | 0% | 每场展会 | 展会相关设计稿信息和规格出错次数\n微博公众号视觉交付率 | 100% | 每周 | 微博周更3-4张海报+公众号月更视觉按时交付\nAI设计师 | AI工具产出效率提升 | ≥30% | 每月 | 使用AI工具相比传统设计方式的效率提升比例\nAI素材可用率 | ≥80% | 每周 | AI生成的素材中可直接使用的比例\n产品策划 | 新品内容准备及时率 | 100% | 按新品 | 新品提前2个月完成内容准备的比例\n违禁词检测通过率 | 100% | 每周                           \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认 量并进行优化。3. 设备维护：摄影器材深度维护", "workStandards": "视觉负责人 / 渠道设计师 | DS-SOP-1 | 电商大促全渠道视觉设计执行 | 【流程说明】涵盖天猫/京东/拼多多/抖音全渠道大促视觉方案的标准化执行流程\n\n1. 活动方案对接：接收运营端大促活动方案，明确活动主题、核心利益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认：与品牌部确认展会基本信息(规模/展位尺寸/主题/预算)  →  2. 设计方案制定：制定展会/活动整体视觉设计方案(展位设计/物料清单)  →  3. 设计稿件输出：完成展会所有视觉设计稿件(背景墙/宣传折页/招贴立牌等)  →  4. 方案评审确认：组织品牌部/领导层设计方案评审，确认最终方案\n                              ↓                              \n8. 搭建安装执行：展前完成展位搭建和物料安装  ←  7. 物料到货验收：物料到货后验收质量和数量，确认无误  ←  6. 物料制作跟进：跟进物料制作进度(制作工期久的每周跟进，短的2-3天跟进)  ←  5. 物料供应商筛选：筛选物料制作供应商，进行询价比价\n                              ↓                              \n9. 现场效果确认：开展当日检查整体视觉效果，确保品牌形象完整呈现  →  10. 撤展与物料回收：展会结束后撤展和可回收物料整理  →  11. 费用核算归档：完成展会费用核算、供应商评价、设计素材归档  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n产品策划 | DS-SOP-6 | 新品详情页标准内容制作 | 【流程说明】新品上市前产品详情页内容的标准制定和制作流程\n\n1. 新品信息获取：从产品经理获取新品完整信息(配方/功效/成分/定位/定价)  →  2. 竞品内容分析：收集对标竞品的详情页内容表达模式和卖点宣称  →  3. 产品卖点提炼：与研发/产品经理沟通确认核心卖点和技术支撑点  →  4. 内容方案制定：制定产品详情页内容方案(产品介绍/功效说明/成分解读/使用场景)\n                              ↓                              \n8. 设计稿件审核：审核设计稿中的产品信息、功效表达是否准确无误  ←  7. 设计方案输出：向设计团队输出详情页设计方案和设计要求  ←  6. 文案撰写优化：撰写产品详情页文案，确保表述妥当、违禁词0  ←  5. 法规合规检查：对照《化妆品功效宣称评价规范》检查卖点表述合规性\n                              ↓                              \n9. 多部门确认：与研发/产品经理/运营沟通确认内容无误、表述妥当  →  10. 上架检查：上架后检查详情页在产品详情页的实际展示效果  →  11. 效果跟踪优化：跟踪详情页转化率，根据数据反馈持续优化内容  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌内容策划 / 摄像岗 / 摄影岗 | DS-SOP-7 | 品牌视频/摄影项目全流程制作 | 【流程说明】品牌视频和摄影项目从创意到成品的标准化全流程管理\n\n1. 需求对接确认：与品牌部/产品经理确认视频/摄影项目需求和交付标准  →  2. 创意方案策划：策划创意方案(拍摄主题/视觉风格/分镜脚本)  →  3. 方案评审确认：提交创意方案给需求方评审确认  →  4. 拍摄方案设计：设计详细拍摄方案(场地/灯光/道具/模特/服装)\n                              ↓ . 现场清洁：清理拍摄场地和设备\n20 | 摄像岗 | 每周 | 1. 素材整理：按项目对拍摄素材分类命名归档。2. 设备保养：深度清洁和维护拍摄设备。3. 拍摄复盘：复盘拍素材质与剪辑团队沟通优化\n21 | 摄像岗 | 每月 | 1. 月度拍摄统计：统计月度拍摄视频数量和类型。2. 设备检修：对拍摄设备进行全面检修。3. 技能提升：学习新的拍摄技法和布光技巧\n22 | 摄影岗 | 每日 | 1. 产品拍摄：按排期完成当日产品静物拍摄。2. 图片处理：对拍摄照片进行后期调色修图处理。3. 素材归档：完成当日拍摄照片的分类归档\n23 | 摄影岗 | 每周 | 1. 拍摄方案设计：根据下周需求设计拍摄方案和场景。2. 设备保养：维护摄影器材和灯光设备。3. 素材整理：整理归档本周拍摄素材\n24 | 摄影岗 | 每月 | 1. 产品图片库更新：更新维护产品图片库。2. 拍摄质量复盘：复盘月度拍摄质量并进行优化。3. 设备维护：摄影器材深度维护", "workStandards": "视觉负责人 / 渠道设计师 | DS-SOP-1 | 电商大促全渠道视觉设计执行 | 【流程说明】涵盖天猫/京东/拼多多/抖音全渠道大促视觉方案的标准化执行流程\n\n1. 活动方案对接：接收运营端大促活动方案，明确活动主题、核心利益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认：与品牌部确认展会基本信息(规模/展位尺寸/主题/预算)  →  2. 设计方案制定：制定展会/活动整体视觉设计方案(展位设计/物料清单)  →  3. 设计稿件输出：完成展会所有视觉设计稿件(背景墙/宣传折页/招贴立牌等)  →  4. 方案评审确认：组织品牌部/领导层设计方案评审，确认最终方案\n                              ↓                              \n8. 搭建安装执行：展前完成展位搭建和物料安装  ←  7. 物料到货验收：物料到货后验收质量和数量，确认无误  ←  6. 物料制作跟进：跟进物料制作进度(制作工期久的每周跟进，短的2-3天跟进)  ←  5. 物料供应商筛选：筛选物料制作供应商，进行询价比价\n                              ↓                              \n9. 现场效果确认：开展当日检查整体视觉效果，确保品牌形象完整呈现  →  10. 撤展与物料回收：展会结束后撤展和可回收物料整理  →  11. 费用核算归档：完成展会费用核算、供应商评价、设计素材归档  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n产品策划 | DS-SOP-6 | 新品详情页标准内容制作 | 【流程说明】新品上市前产品详情页内容的标准制定和制作流程\n\n1. 新品信息获取：从产品经理获取新品完整信息(配方/功效/成分/定位/定价)  →  2. 竞品内容分析：收集对标竞品的详情页内容表达模式和卖点宣称  →  3. 产品卖点提炼：与研发/产品经理沟通确认核心卖点和技术支撑点  →  4. 内容方案制定：制定产品详情页内容方案(产品介绍/功效说明/成分解读/使用场景)\n                              ↓                              \n8. 设计稿件审核：审核设计稿中的产品信息、功效表达是否准确无误  ←  7. 设计方案输出：向设计团队输出详情页设计方案和设计要求  ←  6. 文案撰写优化：撰写产品详情页文案，确保表述妥当、违禁词0  ←  5. 法规合规检查：对照《化妆品功效宣称评价规范》检查卖点表述合规性\n                              ↓                              \n9. 多部门确认：与研发/产品经理/运营沟通确认内容无误、表述妥当  →  10. 上架检查：上架后检查详情页在产品详情页的实际展示效果  →  11. 效果跟踪优化：跟踪详情页转化率，根据数据反馈持续优化内容  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌内容策划 / 摄像岗 / 摄影岗 | DS-SOP-7 | 品牌视频/摄影项目全流程制作 | 【流程说明】品牌视频和摄影项目从创意到成品的标准化全流程管理\n\n1. 需求对接确认：与品牌部/产品经理确认视频/摄影项目需求和交付标准  →  2. 创意方案策划：策划创意方案(拍摄主题/视觉风格/分镜脚本)  →  3. 方案评审确认：提交创意方案给需求方评审确认  →  4. 拍摄方案设计：设计详细拍摄方案(场地/灯光/道具/模特/服装)\n                              ↓                              \n8. 甲方审核修改：提交初稿给需求方审核，根据反馈修改  ←  7. 后期制作处理：视频剪辑/调色/特效/配音(3天后期制作)  ←  6. 正式拍摄执行：按拍摄方案执行拍摄(2天中期拍摄)  ←  5. 拍摄准备执行：准备拍摄所需设备和物料(3天前期准备)\n                              ↓                              \n9. 终稿确认交付：需求方终审确认后交付最终成品  →  10. 项目复盘归档：完成项目复盘，归档制作文件和经验  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）", "kpiStandards": "视觉负责人 | 团队设计产出量 | ≥月度目标 | 每月 | 设计团队月度完成设计稿件总数量\n设计需求满足率 | ≥95% | 每周 | 按时完成的设计需求/总设计需求\n设计质量合格率 | ≥98% | 每月 | 审核通过无重大问题的设计稿件占比\n设计稿件返工率 | ≤10% | 每月 | 因质量问题需要重做的设计稿占比\n全渠道视觉统一率 | ≥95% | 每月 | 全渠道视觉输出符合VI规范的比例\n渠道设计师 | 日常设计按时交付率 | ≥95% | 每日 | 24h内完成的日常设计需求比例\n设计出错率 | 0% | 每月 | 全渠道平台设计出错次数(违禁词/信息错误)\n页面完成率 | 100% | 按需求 | 运营提交的页面设计需求完成比例\n达人主图完成率 | 100% | 按需求 | 达人专场直播主图按时完成比例\n大促视觉按时完成率 | 100% | 每场大促 | 大促活动所有视觉素材按时交付\n品牌设计师 | 品牌VI规范执行率 | 100% | 每月 | 品牌物料设计符合VI规范的比例\n物料设计按时交付率 | ≥95% | 每周 | 品牌物料按排期完成设计的比例\n展会物料出错率 | 0% | 每场展会 | 展会相关设计稿信息和规格出错次数\n微博公众号视觉交付率 | 100% | 每周 | 微博周更3-4张海报+公众号月更视觉按时交付\nAI设计师 | AI工具产出效率提升 | ≥30% | 每月 | 使用AI工具相比传统设计方式的效率提升比例\nAI素材可用率 | ≥80% | 每周 | AI生成的素材中可直接使用的比例\n产品策划 | 新品内容准备及时率 | 100% | 按新品 | 新品提前2个月完成内容准备的比例\n违禁词检测通过率 | 100% | 每周 | 每周排查中未发现违禁词的比例\n运营需求响应及时率 | ≥90% | 每周 | 运营提出的产品内容需求按时完成比例\n品牌内容策划 | 视频脚本按时交付率 | 100% | 按项目 | 视频创意脚本按时输出给拍摄团队的比例\n视频传播效果达成率 | ≥80% | 每月 | 品牌视频内容传播效果达成预设目标的比例\n摄像岗 | 月度视频产出量 | ≥5个/月 | 每月 | 每月产出日常品宣和节日主题视频数量\n视频素材可用率 | ≥95% | 每周 | 拍摄素材中可直接用于后期制作的比例\n拍摄按时完成率 | 100% | 按项目 | 按约定时间完成拍摄任务的比例\n摄影岗 | 产品图片月度产出量 | ≥月度目标 | 每月 | 月度完成产品静物摄影拍摄张数\n拍摄图片合格率 | ≥98% | 每周 | 拍摄图片通过后期审核的合格比例"}, "count": 1, "people": [{"name": "产品拍摄 杨昊鑫", "kpi": "拍摄产出量30% + 图片质量30% + 后期处理效率25% + 素材管理15%", "shops": []}]}]}, "departments": [{ %，回款（天猫旗舰店）30%，利润（天猫旗舰店）30%，毛利（天猫旗舰店）20%",pf={l3ByDept:{"天猫（阿里生态）":[{name:"阿里生态负责人",count:1,people:[{name:"阿里生态负责人 周忠丽",kpi:"",shops:["后台可编辑占位"]}],details:{jobResponsibilities:`1. 平台运营策略与目标管控
负责天猫、猫超、得物、小红书等全渠道店铺的整体运营规划，制定年度/季度销售目标及流量、转化率等核心指标；统筹推广预算分配与ROI管控，监控万相台、关键词投放效果；主导大促及日常活动策划、费用测算与执行监督；统筹全店视觉素材规划与店铺基建巡检，维护价格体系与合规性。

2. 平台资源整合与分销体系管理
主导与阿里小二等平台方的资源谈判，争取百亿补贴、淘金币、闪购等场域资源并跟踪效果；制定线上分销政策、价格管控及库存周转机制，监控分销渠道动销与库存数据，实施分层运营策略，清理低效渠道，维护全渠道价格统一与品牌形象。

3. 数据决策与供应链协同
运用生意参谋、策略中心等工具分析销售、流量、搜索词及竞品动态，定位问题并输出改进方案；协同供应链制定入仓计划、滞销品清盘及新品推广节奏，保障库存健康与供给效率，推动销售目标达成。

4. 内容生态与会员资产运营
制定内容营销及达人直播预算与目标，拓展MCN机构及核心达人，监控直播ROI、新客成本及费销比；统筹会员体系运营，监控入会率、复购率等活动，推动新客转化与老客复购，提升会员生命周期价值。

5. 团队建设与跨部门协作
搭建并管理运营、推广、主播、分销等岗位团队，制定人员分工、培训计划与绩效考核体系；主导与市场、供应链、客服等部门的资源整合与项目落地，确保高效协作与执行，持续提升团队专业能力。`,jobRequirements:"专科及以上学历，2年以上相关经验，需操盘过亿级天猫或线上分销体系，深度熟悉阿里生态规则，具备平台运营、数据分析、团队领导与行业洞察能力，沟通谈判能力强，熟练使用办公及进销存系统，责任心强且勇于挑战。",workProcess:`【每日】
1. 查看全渠道销售数据、推广ROI及核心单品表现，监控回款与花费，异常即时预警；审批各运营提交的日报、费用申请及活动方案；协调跨部门资源处理紧急问题。

【每周】
1. 组织阿里生态周会，汇总各板块工作进展，输出周度总结与下周重点；审核各渠道周报及竞品分析报告，指导运营策略调整；对接平台小二争取资源，跟进重点项目进度。

【每月】
1. 复盘上月全渠道核心指标达成情况，拆解本月目标并制定策略规划；审核月度推广预算分配与内容营销方案；组织月度/季度复盘会，输出总结报告同步事业部主理人。`,workStandards:"后台可编辑占位内容",kpiStandards:"后台可编辑占位内容"},kpiWeights:Fu},{name:"平台运营岗",count:12,people:[{name:"品牌猫超、得物店长 高凯",kpi:"渠道达成（天猫+猫超+专C）20%；渠道回款达成（天猫超市+专C）40%；渠道利润达成（天猫超市+专C）30%；工作表现 10%",shops:["后台可编辑占位"]},{name:"天猫官旗店人群运营 朱丽娟",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店付费推广 李冬淞",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店人群运营、视觉运营 苏月",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店内容运营 蒋倩倩",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店场域运营 周佳敬",kpi:"",shops:["后台可编辑占位"]},{name:"天猫伊帕尔汗官旗店长 张恒",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店内容运营、闪购运营 于越",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店达播运营 毕研博",kpi:"",shops:["后台可编辑占位"]},{name:"品牌天猫专卖店运营 刘静",kpi:"渠道达成（天猫+猫超+专C）20%；渠道回款达成（天猫超市+专C）40%；渠道利润达成（天猫超市+专C）30%；工作表现 10%",shops:["后台可编辑占位"]},{name:"天猫官旗店达播运营 李建平",kpi:"",shops:["后台可编辑占位"]},{name:"天猫官旗店数据运营 董晓钰",kpi:"",shops:["后台可编辑占位"]}],details:{jobResponsibilities:`统筹多平台店铺运营，管控目标、数据与合规
统筹天猫旗舰店、猫超、得物、专卖店及小红书店铺的整体运营，拆解并落实各平台销售目标，每日巡检店铺基建与商品状态，跟踪核心单品访客、转化率、GMV等数据；对接猫超小二争取资源，制定入仓计划并协调补货；监控得物及小红书订单处理与售后；排查违规预警及敏感词，维护价格体系，定期复盘并优化策略。

1. 百亿补贴等场域活动提报、淘客对接及闪购渠道管理
提报百亿补贴、淘金币等活动，争取平台补贴并跟踪效果；对接淘客机构，谈判单品机制并测算毛利，提前报备防破价，活动期间实时检查状态；管理闪购渠道入仓计划，每周盘点库存并及时补货，消化滞销品，筛选活动并申请资源，跟踪销售数据及新品入仓。

2. 全店视觉素材设计、配置与更新
按排期完成主图、SKU图、详情页、视频等单品视觉配置；发布首页、二级页、权益图等店铺素材；大促前根据活动方案输出视觉文案并沟通设计完成素材；负责渠道二级页设计与链接测试；定期更新全量商品主图及主推推广图，检查利益点展示位置。

3. 推广投放与数据报表分析，提供决策支持
制定月度推广预算分配方案，明确各渠道ROI目标；每日监控万相台/关键词推广的ROI、加购率等，异常时即时预警优化；每周复盘创意素材效果，监控竞品推广节奏；同时负责制作日报/周报/月报，跟踪各渠道数据并预警异常，分析竞品销售、流量结构及搜索词，为推广和运营提供数据支持。

4. 内容营销与达人直播合作，提升引流转化
制定内容预算及各渠道目标，规划发布日历；拓展维护MCN机构，谈判商单费用并跟进投流；筛选达人、审核脚本视频，产出逛逛短视频并跟踪效果。同时负责达人拓展与商务谈判，根据场次制定选品清单，直播前寄样并制作口播手卡，直播中实时监控流量与GMV，统计ROI、新客成本、费销比，完成合同与费用结算。

5. 会员体系管理、权益配置与人群精准触达
监控入会率、会员销售额占比、客单价、复购率等核心指标，异常时圈选目标人群；配置新人礼、会员券、立减、积分兑换等权益；策划每月会员日活动，更新年度礼包及挑战计划；按排期报名U先派样并跟踪回购数据；大促前完成专属客服触达、淘群运营及短信推送；对新/老/流失会员分层执行差异化触达方案。

6. 自播间运营、付费跟踪、活动报名与主播管理
制定月度预算及直播排期；每日跟进付费投放的完播率、点击率、ROI，优化低效计划；提报闪降、闪赠及大场活动，申请专场资源；管理主播，对齐主推款与话术，实时监控数据，直播后复盘观看量、会员新增、成交金额等；晚间维护AI直播话术库并监控效果。`,jobRequirements:"专科及以上，市场营销、电商、传媒相关专业，1年以上美妆或相关行业电商运营经验，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。",workProcess:`【每日】
1. 店铺基建巡检与合规维护：巡检各店铺首页、活动页、详情页及促销标签，核实活动库存；查看后台投诉、物流、退款待办及违规预警，排查敏感词；维护商品上下架状态、问答与买家秀，核对售价及活动上线情况。

2. 核心数据跟踪与推广监控：拉取回款及各渠道花费、ROI数据，关注重点单品访客、转化率、GMV，波动超15%预警；检查推广账户余额及计划状态，监控CTR、PPC、ROI、加购率，异常即时优化。

3. 会员与人群分层触达：监控入会率、会员销售额占比、复购率等指标，标记异常并圈选目标人群；对新/老/流失会员执行差异化触达任务。

4. 内容产出与直播运营：产出逛逛短视频并跟踪投流ROI；跟进直播付费数据，优化低效计划；管理主播对齐主推款与话术，实时监控数据；晚间维护AI直播。

5. 活动提报与竞品分析：检查百亿补贴等活动通知并提报，争取补贴，上线即时检查主图、详情及跳转；分析店铺及TOP产品排名、竞品销售数据及营销动作，拆解视觉卖点。

【每周】
1. 数据复盘与目标拆解：输出周报分析上周销售完成情况，拆解本周目标，对比竞品策略。

2. 合规排查与竞品洞察：排查违规及投诉，检查违禁词；分析飙升竞品优劣及营销动作；跟踪推广素材效果，低于均值1.2倍替换，监控竞品推广节奏；输出达人效果评估表，优化合作策略。

3. 费用复盘与内容优化：复盘种草投流情况，规划下周各渠道费用；复盘内容渠道消耗、ROI、新客成本，淘汰低效形式，规划下周发布日历。

4. 库存盘点与闪购维护：盘点闪购库存，消化滞销品，及时补货，筛选可提报活动。

【每月】
1. 运营复盘与目标拆解：复盘上月核心指标及渠道达成情况，拆解本月各渠道及每日销售任务；规划活动提报节奏。

2. 商品管理、价格维护与内容直播规划：盘点库存制定滞销清仓方案，明确新品目标与推广节奏，制定各品类运营策略及资源分配方案；维护产品价格，记录竞品调价策略，统计各价格带贡献；制定内容与直播费用预算、发布日历及排期目标。

①承接公司年度销售目标，统筹分解为部门季度/月度指标并下达各成员及客户；
②按日/周/月/季/年追踪整体达成进度，对业绩缺口及时干预并督导整改；
③统筹缺口客户提升方案制定并督导落地；
④对部门整体销售回款、渠道利润及品牌达成负总责。

二、新客户开发与经销商体系管理
①主导新客户开发与招商，制定年度新客户开发目标与拓展策略；
②统筹经销商开发、分级与汰换，把控经销商体系健康度；
③决策大客户合作条款与授信额度，统筹客户授权体系规范；
④督导客户授权管理，防范越权及串货风险。

三、活动政策制定与营销资源统筹
①制定年度渠道返利、订货、陈列激励及大促活动政策方案；
②审批活动档期方案、签呈及费比测算；
③协调设计、品牌、供应链等跨部门资源支持活动落地；
④全程监控活动投入产出，主导档期复盘及策略优化。

四、清仓品处理与库存策略统筹
①主导清仓品盘点与处理策略制定，统筹临期/滞销品清理方案；
②决策清仓品定价及促销政策；
③统筹渠道库存健康度监控，制定库存周转与预警策略；
④协调供应链保障订单发货效率，严防异常投产。

五、新品策略与市场洞察决策
①决策新品在分销渠道的定价策略及利润空间；
②审批新品推广方案及配套物料计划；
③统筹新品动销分析并决策策略调整；
④主导竞品月度分析及终端走访，制定竞争应对策略。`,jobRequirements:"专科及以上销售类相关专业，拥有2年以上电商运营经验，了解分销渠道的特点和运作流程，具备数据分析、团队管理及商务谈判能力，熟练使用办公与进销存系统，有较强行业洞察力、责任心与全局领导力。",workProcess:`【每日】

2. 处理需决策的客户问题与商务谈判；审批清仓品临时处理方案，跟进核心分销商重大事项

①负责日常客户订单受理、审核与发货跟进，确保订单及时准确履约；
②对接客户日常补货需求，跟进发货及物流状态；
③处理订单异常及售后问题；
④维护客户订货台账，按日/周/月统计订单与回款数据，推进销售指标达成。

二、库存管理与库存预警
①负责渠道库存日常监控与盘点，维护库存数据准确性；
②跟踪库存周转及临期/滞销品情况，及时上报预警；
③协助执行清仓品处理与临期品促销落地；
④对接供应链协调补货与调拨，保障发货效率。

三、合同签约与客户授权管理
①负责与客户签订年度销售合同及补充协议，跟进合同续签与归档；
②办理客户授权手续，维护客户授权台账与资质审核；
③跟进客户授信额度使用及账期管理；
④确保合同与授权流程合规闭环。

四、返利测算与政策落地执行
①负责经销商年度/季度返利测算与核算；
②传达并执行渠道返利、订货、陈列激励政策，监督经销商落地；
③协助参与大促活动政策制定，提供数据支持；
④跟进政策执行结果，输出执行报表。

五、营销活动执行与日常客情维护
①执行活动档期方案，跟进活动上线及业绩达成；
②对接设计需求及物料支持，跟进终端形象同步；
③活动档期结束后输出复盘数据；
④维护日常客情关系，跟进客户需求与反馈。`,jobRequirements:"专科及以上，1年以上相关工作经验，了解分销渠道的特点和运作流程，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。",workProcess:`【每日】
1. 负责日常客户订单受理、审核与发货跟进，确保订单24h内发货；处理订单异常及售后退换货问题
2. 统计各平台及分销商当日销售数据(GMV、订单量、客单价)计算指标达成率，输出日销简报；监控分销商库存周转情况，对低库存提醒补货，识别滞销品上报预警
3. 办理客户授权手续与资质审核，跟进授权进度确保流程合规；对接分销商日常订货需求与物流状态
4. 处理分销商及终端消费者咨询与投诉，确保客服响应时效达标；收集客户反馈归类整理，上报异常问题

【每周】
1. 汇总本周各平台及分销商销售数据分析环比与同比变化，诊断销售波动原因；输出周度销售分析报告并制定下周提升措施
2. 与核心分销商进行周度沟通了解经营困难与需求，跟进分销商进货达成进度推动缺口补单；检查在执行活动的资源位价格与库存到位情况，跟踪活动期间GMV达成异常及时调整并上报
3. 汇总本周库存周转及临期滞销品数据，协助执行清仓品促销落地；跟进分销商合同续签与归档进度，确保合同流程闭环
4. 整理本周竞品价格活动及渠道策略汇总，输出竞品周度分析简报；跟进客户授权台账更新与授信额度使用情况

【每月】
1. 汇总月度各平台及分销商销售数据对比月度指标达成率，分析达成或未达成原因制定下月改进措施；核算月度渠道返利及各项激励费用，输出费用明细表并提交审批

3. 执行活动档期方案含机制价格物料，跟进活动上线及业绩达成；对接设计需求及物料支持，输出活动复盘数据；完成经销商季度返利测算与核算
