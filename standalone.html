）20%，回款（天猫旗舰店）30%，利润（天猫旗舰店）30%，毛利（天猫旗舰店）20%", "workStandardSections": [{"title": "一、计划与追踪管理", "items": [{"title": "1.1 年度预算计划制定与拆解", "image": "./ws-images/ws_img_1.png", "content": "开始→通知全年预算制定→各渠道制定全年预算→阿里生态负责人审核年度预算→线上营销负责人审核年度预算→行销汇总各渠道预算→运营管理部汇总全公司年度预算→运营下发预算拆解任务→各渠道拆解预算至月度→阿里负责人审核月度预算→线上营销审核月度→行销汇总月度预算→事业部主理人审核月度→运营汇总全公司预算目标→结束（审批通过）"}, {"title": "1.2 营销计划制定与拆解", "image": "./ws-images/ws_img_2.png", "content": "开始→天猫/媒介/分销负责人制定年度季度营销计划→阿里负责人审核→线上营销负责人审核→事业部主理人审核→三大负责人拆解月度营销计划→阿里负责人审核月度→线上负责人审核→每月月中拆解日计划→阿里负责人审核日计划→结束"}, {"title": "1.3 日计划追踪与复盘", "image": "./ws-images/ws_img_3.png", "content": "开始→收集每日达成数据→判断计划是否达成→未达成：各负责人原因分析→输出优化策略→优化策略确认归档→结束；达成：直接归档结束"}, {"title": "1.4 阿里生态周度复盘", "image": "./ws-images/ws_img_4.png", "content": "开始→汇总一周日追踪表→组织周会→各板块汇报工作→阿里负责人周度总结→运营记录会议要点→微信群同步纪要→结束"}, {"title": "1.5 事业部周度复盘", "image": "./ws-images/ws_img_5.png", "content": "开始→行销组织周会→各渠道运营总结周度数据→各板块负责人审核报告→阿里负责人审核报告→各渠道负责人现场汇报→事业部主理人总结→行销记录会议纪要→下发各渠道→结束"}, {"title": "1.6 事业部月/季/半年度复盘", "image": "./ws-images/ws_img_6.png", "content": "开始→行销组织复盘会→各运营输出阶段总结报告→各板块负责人审核报告→阿里负责人审核报告→各渠道负责人汇报→事业部主理人总结→行销记录纪要→同步各渠道→结束"}, {"title": "1.7 公司月/半/年度复盘", "image": "./ws-images/ws_img_7.png", "content": "开始→经营管理部组织会议→线上营销通知各渠道撰写报告→各运营汇总阶段数据报告→板块负责人审核→阿里负责人审核→线上营销负责人审核→经营管理部汇总全渠道报告→线上营销负责人汇报→公司领导总结→经营管理部记录纪要→下发渠道→结束"}]}, {"title": "二、 新品引入管理", "items": [{"title": "2.1 新品立项", "image": "./ws-images/ws_img_8.png", "content": "开始→媒介做全新品/品线升级市场洞察→媒介牵头写调研报告→阿里负责人审核报告→线上营销审核报告→媒介填写产品立项表+新品推广方案→阿里审批→线上审批→事业部主理人审批→提交产品部走立项流程→产品部审批通过→下发通知→结束"}, {"title": "2.2 新品上市推广", "image": "./ws-images/ws_img_9.png", "content": "开始→媒介撰写新品上市推广计划→阿里负责人审批计划→媒介撰写新品营销方案→阿里审核方案→线上审核→事业部主理人审核→结束"}]}, {"title": "三、 媒介推广管理", "items": [{"title": "3.1 日常推广策划", "image": "./ws-images/ws_img_10.png", "content": "开始→市场及竞品分析→判断是否需要长线规划\n分支1（需要长线）：编导制定长线推广计划→向阿里负责人汇报→负责人审核→未通过调整计划/通过进入阶段性计划\n分支2（无需长线）：直接制定阶段性推广计划→向阿里汇报审核→未通过调整/通过向各种草渠道宣贯→周度月度推广复盘→结束"}, {"title": "3.2 种草推广发起", "image": "./ws-images/ws_img_11.png", "content": "开始→每月底排种草活动→确定内容投放策略→分渠道制定推广预算→判断是否使用年框服务商\n分支1（不用）：多服务商比价筛选→签订合作协议→向服务商提需求→服务商达人招募初筛→媒介二次筛选达人→服务商制作达人排期→收集达人脚本→线上修改脚本→达人按排期发布检查→结束\n分支2（使用）：直接对接年框服务商，后续流程同上"}, {"title": "3.3 种草跟踪及投流", "image": "./ws-images/ws_img_12.png", "content": "开始→达人种草视频上线→服务商提交日度投流表→媒介分析投放数据→判断种草效果是否结束\n分支1（未结束）：调整投放内容/加大投放→持续数据跟踪循环\n分支2（结束）：收集服务商汇报表→服务商费用结算→媒介种草数据复盘→结束"}, {"title": "3.4 站内投流", "image": "./ws-images/ws_img_13.png", "content": "开始→提前规划站内投流→制作投流预估表→提交费用申请→匹配活动进行投放→每日分析站内费用表→判断活动是否结束\n分支1（未结束）：调整投放策略持续投放\n分支2（结束）：制作复盘报告→财务费用核销→结束"}, {"title": "3.5 阿里达播管理", "image": "./ws-images/ws_img_14.png", "content": "开始→依据营销计划做达播规划→筛选合作达人→达人商务寄样沟通合作→签订合作协议→判断是否预付费用\n分支1（需预付）：先行结算费用→直播物料链接准备→达人直播全程支持→直播完成后结算尾款→达人数据复盘→判断是否长期合作\n长期合作：沟通年度框架→签订年框→日常维护达人→周期复盘→到期判断是否续约；不长期：单次合作闭环结束"}, {"title": "3.6 年框服务商管理", "image": "./ws-images/ws_img_15.png", "content": "开始→战略部选定服务商→签订年框协议→各种草渠道日常合作→合同到期前收集渠道反馈→媒介汇总服务商整体表现→战略部做出续约/解约决策→结束"}]}, {"title": "四、天猫直播管理", "items": [{"title": "4.1 天猫直播管理", "image": "./ws-images/ws_img_16.png", "content": "开始→直播运营根据营销计划排直播计划→开播前软硬件/优惠券全准备→直播中控实时配合主播→主播直播讲解互动→下播后直播间卫生整理→每日+月度直播数据复盘→结束"}]}, {"title": "五、 店铺运营管理", "items": [{"title": "5.1 店铺日常维护", "image": "./ws-images/ws_img_17.png", "content": "开始→每日登录生意参谋查看全数据→发现指标异常→判断问题归属\n店铺可自行处理：直接调整商品/库存→验证数据恢复；\n推广问题：协调媒介处理；\n客服问题：对接客服部；\n页面视觉：对接设计；\n库存物流：对接仓储；平台规则：对接天猫小二；其他：协调财务法务→全部问题验证数据正常→结束"}, {"title": "5.2 店铺咨询评价管理", "image": "./ws-images/ws_img_18.png", "content": "开始→每周查看问大家+中差评→标准化回复咨询→差评同步客服处理→判断差评是否解决\n已解决：归档；未解决：标准化回复差评→月度汇总差评复盘优化→结束"}, {"title": "5.3 竞品信息追踪", "image": "./ws-images/ws_img_19.png", "content": "开始→每日生意参谋监控竞对销量→判断竞品增长原因\n新品爆品：跳转新品立项；\n促销降价：跳转日常活动策划；\n投放引流：跳转媒介推广策划→结束"}, {"title": "5.4 会员管理", "image": "./ws-images/ws_img_20.png", "content": "开始→月底制定次月会员计划→设置新人礼完成拉新→开展会员日/空瓶回收等非平台活动→活动复盘→配合大促做平台会员活动→大促整体复盘→结束"}]}]}, {"name": "活动运营岗", "count": 2, "people": [{"name": "天猫官旗店店长 李娜", "kpi": "", "shops": ["后台可编辑占位"]}, {"name": "天猫官旗店活动运营、直播运营 刘叶", "kpi": "", "shops": ["后台可编辑占位"]}], "details": {"jobResponsibilities": "活动策划与执行\n大促及日常活动前7-10个工作日完成方案输出、权益设计、费用测算及签呈，对接视觉文案；上线后全面检查页面、促销标签及库存，确保活动正常进行；活动期间实时跟踪核心数据，每小时刷新指标，异常即时预警并协调各板块应对；活动结束后3个工作日内完成数据复盘与总结报告\n\n目标拆解与商品管理\n月初将月度销售目标拆解至品类/单品，制定流量分配及主推/利润/引流品资源方案；盘点库存并制定滞销清仓方案，明确新品目标与推广节奏；维护产品价格体系，记录竞品调价策略，统计各价格带销售贡献\n\n日常巡检与竞品分析\n每日巡检店铺基建（首页/活动页/详情页/促销标签），核实活动库存；每周排查产品违规及敏感词；每日关注店铺及TOP产品排名变化，每周分析同品类飙升竞品的产品优劣、销售数据及营销动作，拆解优秀竞品的主图逻辑与视觉卖点并输出优化建议", "jobRequirements": "专科及以上，市场营销、电商、传媒相关专业，1年以上美妆或相关行业电商运营经验，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。", "workProcess": "平台运营 | 每日 |  店铺基建巡检与合规维护：巡检各店铺首页、活动页、详情页及促销标签，核实活动库存；查看后台投诉、物流、退款待办及违规预警，排查敏感词；维护商品上下架状态、问答与买家秀，核对售价及活动上线情况\n 核心数据跟踪与推广监控：拉取回款及各渠道花费、ROI数据，关注重点单品访客、转化率、GMV，波动超15%预警；检查推广账户余额及计划状态，监控CTR、PPC、ROI、加购率，异常即时优化\n 会员与人群分层触达：监控入会率、会员销售额占比、复购率等指标，标记异常并圈选目标人群；对新/老/流失会员执行差异化触达任务\n 内容产出与直播运营：产出逛逛短视频并跟踪投流ROI；跟进直播付费数据，优化低效计划；管理主播对齐主推款与话术，实时监控数据；晚间维护AI直播\n 活动提报与竞品分析：检查百亿补贴等活动通知并提报，争取补贴，上线即时检查主图、详情及跳转；分析店铺及TOP产品排名、竞品销售数据及营销动作，拆解视觉卖点\n每周 |  数据复盘与目标拆解：输出周报分析上周销售完成情况，拆解本周目标，对比竞品策略\n 合规排查与竞品洞察：排查违规及投诉，检查违禁词；分析飙升竞品优劣及营销动作；跟踪推广素材效果，低于均值1.2倍替换，监控竞品推广节奏；输出达人效果评估表，优化合作策略\n 费用复盘与内容优化：复盘种草投流情况，规划下周各渠道费用；复盘内容渠道消耗、ROI、新客成本，淘汰低效形式，规划下周发布日历\n 库存盘点与闪购维护：盘点闪购库存，消化滞销品，及时补货，筛选可提报活动\n每月 |  运营复盘与目标拆解：复盘上月核心指标及渠道达成情况，拆解本月各渠道及每日销售任务；规划活动提报节奏\n 商品管理、价格维护与内容直播规划：盘点库存制定滞销清仓方案，明确新品目标与推广节奏，制定各品类运营策略及资源分配方案；维护产品价格，记录竞品调价策略，统计各价格带贡献；制定内容与直播费用预算、发布日历\n 会员活动与猫超/得物维护：策划会员日活动，更新年度礼包及挑战计划；分析猫超/得物销售完成情况，对接小二争取资源，制定入仓计划协调补货\n活动运营 | 每日 | 检查首页、活动页、详情页是否正常；检查各活动入口、优惠券、促销标签是否正确展示；核实活动产品库存是否充足\n每周 | 跟进天猫内违规预警及12315相关投诉；检查产品链接标题、主图、详情页属性；对违规词/敏感广告词进行优化\n关注每日店铺及本店TOP产品排名；分析同品类飙升竞品的产品优劣、销售数据及营销动作；拆解优秀竞品的主图逻辑+视觉卖点\n每月 | 月度计划目标拆解与运营策略：根据月度销售目标进行品类/单品目标拆解；制定各品类运营策略及流量分配方案；确定主推品、利润品、引流品的资源分配\n产品价格、库存预估与周期把控：盘点产品月度消耗情况，计算下月预估库存；识别滞销品并制定清仓方案；根据下月新品上架节奏明确新品目标\n新品策略定制与推广：确定新品目标及推广资源；制定新品上架节奏；协调各渠道资源支持新品推广\n活动方案输出、活动执行、复盘：明确活动级别，确定参与产品及目标；输出全场权益及单品权益方案；活动签呈输出及费用利润测算；活动框架输出及视觉文案；活动上线后全面检查；活动结束后复盘总结\n主播 | 每日 | 直播产品讲解与卖点提炼优化：熟练掌握产品卖点及机制；提炼优化产品讲解话术；与粉丝互动提升停留时长（注意口播违禁词）\n直播复盘与话术优化：复盘本场直播数据；优化讲解话术；调整产品推荐顺序\n个人号日更及账号维护：个人账号每日更新内容；维护粉丝互动；提升个人号影响力\n每周/月 | 种草短视频拍摄（按排期执行）：配合内容运营拍摄种草短视频；根据脚本完成产品展示；确保视频质量符合发布标准", "workStandards": "阿里生态负责人 | 1.1.1.1 | 年度预算计划制定与拆解 | 【流程说明】通过\"预算制定→多级审核→月度拆解→闭环同步\"四大阶段，将企业年度战略目标转化为可执行的月度预算计划\n\n1. 通知全年预算制定  →  2. 制定全年预算（各渠道）  →  3. 阿里生态年度预算审核  →  4. 线上营销年度预算审核\n                                                                 ↓\n8. 下发月度拆解任务  ←  7. 汇总统计全年预算  ←  6. 事业部预算审核  ←  5. 汇总统计各渠道预算\n↓\n9. 将预算拆解至月度  →  10. 月度预算审核\n1.1.1.2 | 营销计划制定与拆解 | 【流程说明】通过年度计划→季度计划→月度计划→日计划层层拆解，实现更加细致管理目标达成\n\n1. 制定年度和季度营销计划  →  2. 阿里生态审核年度季度计划  →  3. 线上营销负责人审核  →  4. 事业部主理人审核\n                                                                  ↓\n8. 每月月中制定下月日计划  ←  7. 线上营销负责人审核月度计划  ←  6. 阿里生态审核月度计划  ←  5. 拆解月度营销计划\n↓\n9. 日计划审核\n1.1.1.4 | 阿里生态周度复盘 | 【流程说明】阿里生态渠道内部每周通过销售达成、待协调情况进行会议沟通和总结\n\n1. 汇总每日计划跟踪表  →  2. 组织周会  →  3. 各板块本周工作汇报总结  →  4. 周度总结（阿里生态负责人）\n                                                               ↓\n6. 同步会议要点至干系人  ←  5. 记录会议要点\n1.1.1.5 | 事业部周度复盘 | 【流程说明】颐莲事业部每周通过销售达成、待协调情况进行会议沟通和总结\n\n1. 行销部组织周会  →  2. 各渠道周度工作总结  →  3. 运营端/种草端/分销端审核报告  →  4. 阿里生态负责人审核周报\n                                                                    ↓\n8. 下发至各渠道  ←  7. 记录会议纪要  ←  6. 事业部主理人总结指示  ←  5. 各渠道负责人汇报\n1.1.1.6 | 事业部月度/季度/半年度复盘 | 【流程说明】颐莲事业部每季度/每半年通过销售达成、下一步工作安排、待协调情况进行会议沟通和总结\n\n1. 行销部组织复盘会议  →  2. 各渠道目标完成情况及下步计划总结  →  3. 各板块负责人审核报告  →  4. 阿里生态负责人审核报告\n                                                                        ↓\n8. 下发至各渠道  ←  7. 记录会议纪要  ←  6. 事业部主理人总结指示  ←  5. 季度/半年度汇报\n1.1.1.7 | 公司月度/半年度/年度复盘 | 【流程说明】公司整体每月度/半年度/年度通过销售达成、下一步工作安排、待协调情况进行会议沟通和总结\n\n1. 经营管理部组织复盘会议  →  2. 线上营销负责人通知报告撰写  →  3. 各渠道目标完成情况及下步计划总结  →  4. 各板块负责人审核报告\n                                                                            ↓\n8. 线上营销负责人汇报  ←  7. 经营管理部汇总各渠道报告  ←  6. 线上营销负责人审核报告  ←  5. 阿里生态负责人审核报告\n↓\n9. 领导班子总结指示  →  10. 记录会议纪要\n平台运营岗 | 1.1.1.3 | 日计划追踪与复盘 | 【流程说明】每日通过对日计划达成追踪复盘并调整策略，以确保每日运营目标高效达成\n\n1. 每日日计划达成情况收集  →  2. 判断是否达成目标  →  3. 未达成→原因分析  →  4. 提出优化策略\n                                                            ↓\n5. 归档日追踪文档\n1.3.1.1 | 日常推广策划 | 【流程说明】根据市场及竞品分析，明确品牌现阶段推广策略，并制定推广计划向各渠道进行宣贯，最终根据推广效果进行复盘\n\n1. 市场及竞品分析  →  2. 判断是否需要制定长线规划  →  3. 制定长线推广规划  →  4. 长线推广计划汇报\n                                                             ↓\n8. 阶段性推广计划汇报  ←  7. 制定阶段性推广计划  ←  6. 判断是否通过  ←  5. 阿里生态负责人审核\n↓\n9. 阿里生态负责人审核  →  10. 判断是否通过  →  11. 向各渠道宣贯推广计划  →  12. 跟踪推广效果\n                                                            ↓\n13. 推广计划复盘\n1.2.1.1 | 新品立项 | 【流程说明】基于对市场趋势、竞争对手、目标客户的洞察分析，由阿里生态媒介推广负责人发起审批流程，并制定明确的新品营销方案\n\n1.1. 全新品市场洞察（每年1-2次）  →  1.2. 品线升级市场洞察  →  2. 牵头组织撰写调研报告  →  3. 阿里生态负责人审核报告\n                                                                          ↓\n7. 线上营销负责人审批  ←  6. 阿里生态负责人审批  ←  5. 撰写并提交立项申请表  ←  4. 线上营销负责人审核报告\n↓\n8. 事业部主理人审批  →  9. 产品部完成立项审批流程\n1.2.1.2 | 新品上市推广 | 【流程说明】由媒介推广主导制定新品上市推广计划方案并由品牌事业部、财务部审批完成后，进一步设计新品营销策略方案\n\n1. 牵头组织撰写新品上市推广计划  →  2. 阿里生态负责人审批  →  3. 牵头组织撰写新品营销方案  →  4. 阿里生态负责人审核\n                                                                      ↓\n6. 事业部主理人审核  ←  5. 线上营销负责人审核\n1.3.1.2 | 渠道种草发起 | 【流程说明】基于投放策略及相关预算安排，与代理服务商配合推进各种草渠道达人合作，明确各种草渠道推广内容及发布安排\n\n1. 种草渠道内活动排期  →  2. 确定内容方向及投放策略  →  3. 制定投放预算  →  4. 判断是否选取框架协议服务商\n                                                                 ↓\n8. 达人招募与初筛（外部）  ←  7. 向代理服务商提出执行需求  ←  6. 签订合作协议  ←  5. 单次活动服务商选择\n↓\n9. 内部再次筛选达人  →  10. 制定达人排期表（外部）  →  11. 脚本创作与审核（外部）  →  12. 脚本初审\n                                                               ↓\n15. 成片审核确认发布  ←  14. 视频制作（外部）  ←  13. 脚本二审（编导）\n1.3.1.3 | 种草跟踪及投流 | 【流程说明】在各渠道种草推广活动发布后，对于种草效果进行分析，并根据分析调整投放策略及内容，最终完成种草活动复盘\n\n1. 收集自然流量及销售转化（外部）  →  2. 流量及销售转化分析  →  3. 判断种草效果是否结束  →  4. 调整投放策略及内容\n                                                                     ↓\n7. 进行种草数据复盘  ←  6. 根据合作安排进行结算  ←  5. 收集服务商工作效果\n1.3.1.4 | 站内投流 | 【流程说明】匹配站内活动节奏，相应地进行站内投流，对投流效果进行跟踪和分析，最终完成站内投流活动复盘\n\n1. 站内投流规划（提前一个月）  →  2. 制定站内投流效果预估表  →  3. 站内投流费用申请  →  4. 匹配活动节奏进行站内投流\n                                                                      ↓\n8. 进行活动投流复盘  ←  7. 调整投放策略及内容  ←  6. 判断活动效果是否结束 销售任务；规划活动提报节奏\n 商品管理、价格维护与内容直播规划：盘点库存制定滞销清仓方案，明确新品目标与推广节奏，制定各品类运营策略及资源分配方案；维护产品价格，记录竞品调价策略，统计各价格带贡献；制定内容与直播费用预算、发布日历\n 会员活动与猫超/得物维护：策划会员日活动，更新年度礼包及挑战计划；分析猫超/得物销售完成情况，对接小二争取资源，制定入仓计划协调补货\n活动运营 | 每日 | 检查首页、活动页、详情页是否正常；检查各活动入口、优惠券、促销标签是否正确展示；核实活动产品库存是否充足\n每周 | 跟进天猫内违规预警及12315相关投诉；检查产品链接标题、主图、详情页属性；对违规词/敏感广告词进行优化\n关注每日店铺及本店TOP产品排名；分析同品类飙升竞品的产品优劣、销售数据及营销动作；拆解优秀竞品的主图逻辑+视觉卖点\n每月 | 月度计划目标拆解与运营策略：根据月度销售目标进行品类/单品目标拆解；制定各品类运营策略及流量分配方案；确定主推品、利润品、引流品的资源分配\n产品价格、库存预估与周期把控：盘点产品月度消耗情况，计算下月预估库存；识别滞销品并制定清仓方案；根据下月新品上架节奏明确新品目标\n新品策略定制与推广：确定新品目标及推广资源；制定新品上架节奏；协调各渠道资源支持新品推广\n活动方案输出、活动执行、复盘：明确活动级别，确定参与产品及目标；输出全场权益及单品权益方案；活动签呈输出及费用利润测算；活动框架输出及视觉文案；活动上线后全面检查；活动结束后复盘总结\n主播 | 每日 | 直播产品讲解与卖点提炼优化：熟练掌握产品卖点及机制；提炼优化产品讲解话术；与粉丝互动提升停留时长（注意口播违禁词）\n直播复盘与话术优化：复盘本场直播数据；优化讲解话术；调整产品推荐顺序\n个人号日更及账号维护：个人账号每日更新内容；维护粉丝互动；提升个人号影响力\n每周/月 | 种草短视频拍摄（按排期执行）：配合内容运营拍摄种草短视频；根据脚本完成产品展示；确保视频质量符合发布标准", "workStandards": "阿里生态负责人 | 1.1.1.1 | 年度预算计划制定与拆解 | 【流程说明】通过\"预算制定→多级审核→月度拆解→闭环同步\"四大阶段，将企业年度战略目标转化为可执行的月度预算计划\n\n1. 通知全年预算制定  →  2. 制定全年预算（各渠道）  →  3. 阿里生态年度预算审核  →  4. 线上营销年度预算审核\n                                                                 ↓\n8. 下发月度拆解任务  ←  7. 汇总统计全年预算  ←  6. 事业部预算审核  ←  5. 汇总统计各渠道预算\n↓\n9. 将预算拆解至月度  →  10. 月度预算审核\n1.1.1.2 | 营销计划制定与拆解 | 【流程说明】通过年度计划→季度计划→月度计划→日计划层层拆解，实现更加细致管理目标达成\n\n1. 制定年度和季度营销计划  →  2. 阿里生态审核年度季度计划  →  3. 线上营销负责人审核  →  4. 事业部主理人审核\n                                                                  ↓\n8. 每月月中制定下月日计划  ←  7. 线上营销负责人审核月度计划  ←  6. 阿里生态审核月度计划  ←  5. 拆解月度营销计划\n↓\n9. 日计划审核\n1.1.1.4 | 阿里生态周度复盘 | 【流程说明】阿里生态渠道内部每周通过销售达成、待协调情况进行会议沟通和总结\n\n1. 汇总每日计划跟踪表  →  2. 组织周会  →  3. 各板块本周工作汇报总结  →  4. 周度总结（阿里生态负责人）\n                                                               ↓\n6. 同步会议要点至干系人  ←  5. 记录会议要点\n1.1.1.5 | 事业部周度复盘 | 【流程说明】颐莲事业部每周通过销售达成、待协调情况进行会议沟通和总结\n\n1. 行销部组织周会  →  2. 各渠道周度工作总结  →  3. 运营端/种草端/分销端审核报告  →  4. 阿里生态负责人审核周报\n                                                                    ↓\n8. 下发至各渠道  ←  7. 记录会议纪要  ←  6. 事业部主理人总结指示  ←  5. 各渠道负责人汇报\n1.1.1.6 | 事业部月度/季度/半年度复盘 | 【流程说明】颐莲事业部每季度/每半年通过销售达成、下一步工作安排、待协调情况进行会议沟通和总结\n\n1. 行销部组织复盘会议  →  2. 各渠道目标完成情况及下步计划总结  →  3. 各板块负责人审核报告  →  4. 阿里生态负责人审核报告\n                                                                        ↓\n8. 下发至各渠道  ←  7. 记录会议纪要  ←  6. 事业部主理人总结指示  ←  5. 季度/半年度汇报\n1.1.1.7 | 公司月度/半年度/年度复盘 | 【流程说明】公司整体每月度/半年度/年度通过销售达成、下一步工作安排、待协调情况进行会议沟通和总结\n\n1. 经营管理部组织复盘会议  →  2. 线上营销负责人通知报告撰写  →  3. 各渠道目标完成情况及下步计划总结  →  4. 各板块负责人审核报告\n                                                                            ↓\n8. 线上营销负责人汇报  ←  7. 经营管理部汇总各渠道报告  ←  6. 线上营销负责人审核报告  ←  5. 阿里生态负责人审核报告\n↓\n9. 领导班子总结指示  →  10. 记录会议纪要\n平台运营岗 | 1.1.1.3 | 日计划追踪与复盘 | 【流程说明】每日通过对日计划达成追踪复盘并调整策略，以确保每日运营目标高效达成\n\n1. 每日日计划达成情况收集  →  2. 判断是否达成目标  →  3. 未达成→原因分析  →  4. 提出优化策略\n                                                            ↓\n5. 归档日追踪文档\n1.3.1.1 | 日常推广策划 | 【流程说明】根据市场及竞品分析，明确品牌现阶段推广策略，并制定推广计划向各渠道进行宣贯，最终根据推广效果进行复盘\n\n1. 市场及竞品分析  →  2. 判断是否需要制定长线规划  →  3. 制定长线推广规划  →  4. 长线推广计划汇报\n                                                             ↓\n8. 阶段性推广计划汇报  ←  7. 制定阶段性推广计划  ←  6. 判断是否通过  ←  5. 阿里生态负责人审核\n↓\n9. 阿里生态负责人审核  →  10. 判断是否通过  →  11. 向各渠道宣贯推广计划  →  12. 跟踪推广效果\n                                                            ↓\n13. 推广计划复盘\n1.2.1.1 | 新品立项 | 【流程说明】基于对市场趋势、竞争对手、目标客户的洞察分析，由阿里生态媒介推广负责人发起审批流程，并制定明确的新品营销方案\n\n1.1. 全新品市场洞察（每年1-2次）  →  1.2. 品线升级市场洞察  →  2. 牵头组织撰写调研报告  →  3. 阿里生态负责人审核报告\n                                                                          ↓\n7. 线上营销负责人审批  ←  6. 阿里生态负责人审批  ←  5. 撰写并提交立项申请表  ←  4. 线上营销负责人审核报告\n↓\n8. 事业部主理人审批  →  9. 产品部完成立项审批流程\n1.2.1.2 | 新品上市推广 | 【流程说明】由媒介推广主导制定新品上市推广计划方案并由品牌事业部、财务部审批完成后，进一步设计新品营销策略方案\n\n1. 牵头组织撰写新品上市推广计划  →  2. 阿里生态负责人审批  →  3. 牵头组织撰写新品营销方案  →  4. 阿里生态负责人审核\n                                                                      ↓\n6. 事业部主理人审核  ←  5. 线上营销负责人审核\n1.3.1.2 | 渠道种草发起 | 【流程说明】基于投放策略及相关预算安排，与代理服务商配合推进各种草渠道达人合作，明确各种草渠道推广内容及发布安排\n\n1. 种草渠道内活动排期  →  2. 确定内容方向及投放策略  →  3. 制定投放预算  →  4. 判断是否选取框架协议服务商\n s": {"jobResponsibilities": "京东店铺运营、活动落地、推广管控\n负责京东自营、POP 店铺基础运营，把控推广 ROI，拓展引流渠道；完成店铺每日/每周/月度/季度/年度的销售回款及销售利润指标；策划执行平台各类营销活动，完成活动实时调优与复盘。\n\n数据监控、竞品调研与策略优化\n监控每日店铺流量、转化、现货率、库存周转等核心数据，数据异常第一时间上报；持续跟踪竞品定价、活动、投放动作，按月输出竞品分析报告，依据调研及数据调整运营、备货、投放策略。\n\n负责全品类品线统筹管理\n统筹所负责全部品类品线整体运营节奏，围绕品线梳理单品结构，针对性制定单品运营、推广方案，统一把控各品线销售、库存、利润表现。", "jobRequirements": "专科及以上，市场营销、电商、传媒相关专业，1 年以上美妆或相关行业电商运营经验，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。", "workProcess": "拓展平台 | 负责人 | 每日\n每周\n每月\n品线运营 | 每日 | 1.跟进店铺流量、成交、货品数据，数据异常即时上报\n2.跟进品线 达成、 会员/PLUS成交\n3.监控推广投产 ROI，同步推广优化需求\n每周 | 1.跟进周销售、利润、货品目标进度\n2.复盘推广、用户、货品数据，针对滞销品线调整运营策略\n3.核对库存周转，分品线梳理货品需求\n4.梳理活动排期，对接设计、客服落实素材与售后预案\n每月 | 1.完成月度销售数据汇总与业绩复盘，拆分各品线业绩完成情况\n2.跟进竞品情况，对标竞品品类打法优化自有品线运营方案\n3.盘点全渠道库存，统筹各品线库存、备货规划\n京东运营岗 | 每日 | 1. 跟进流量、成交、货品数据，异常即时上报\n2. 巡检商品价格、库存、页面信息，完成上下架调整\n3. 跟进会员/PLUS成交，处理用户咨询投诉\n4. 监控推广投产，同步推广优化需求\n每周 | 1. 跟进周销售、利润、货品目标进度\n2. 复盘推广、用户、货品数据，调整策略\n3. 核对库存周转，提交货品调拨需求\n4. 梳理下周活动排期，对接设计、客服\n每月 | 1. 完成月度销售数据汇总与业绩复盘\n2. 输出竞品分析报告，优化运营方案\n3. 盘点全渠道库存\n拼多多运营岗 | 每日 | 1. 跟进统计成交、投产，异常即时上报\n2. 巡检百亿补贴、商品库存与售价\n3. 监控全站推广、多多进宝ROI\n4. 盯竞品低价与秒杀活动策略\n每周 | 1.跟进回款、利润周考核目标\n2. 核查销量缺口，加投或做活动\n3. 收集竞品补贴、佣金政策信息\n4. 规划下周秒杀、资源位排期\n每月 | 1. 制定投放、活动月度方案\n2. 复盘指标缺口，落地补量方案\n3. 输出月度竞品分析\n4. 月度全盘复盘，规划下月打法\n唯品会运营岗 | 每日 | 1. 跟进档期成交、毛利，数据异常及时上报\n2. 巡检特卖商品、库存与限价合规情况\n3. 监控站内投放，跟进推广投产达标\n4. 处理售后差评，维护SVIP高价值会员\n5. 调研竞品档期折扣、清仓策略\n每周 | 1. 跟进周回款、毛利、考核指标\n2. 核对档期缺口，申请平台资源位\n3. 关注竞品特卖价格与活动打法\n每月 | 1. 制定月度档期、投放方案\n2. 复盘指标缺口，调整折扣力度\n3. 输出月度竞品分析报告\n4. 月度全盘复盘，规划下月货品结构", "workStandards": "京东拓展负责人 | JD-SOP-01 | 年度预算计划制定与拆解 | 【流程说明】依据公司年度战略目标，结合京东自营+POP渠道历史销售数据、平台资源规划，制定京东渠道年度预算及月度拆解方案\n\n通知全年预算制定原则  →  各渠道提交预算初稿  →  京东拓展负责人审核  →  事业部汇总审核\n                                        ↓\n月度预算执行跟踪  ←  下发月度拆解任务  ←  公司高层审批 | (手册中该流程\n暂无流程图)\nJD-SOP-02 | 京东渠道月度运营复盘 | 【流程说明】每月汇总京东自营+POP渠道销售、利润、推广ROI、库存周转等核心指标，输出月度复盘报告并制定下月运营规划\n\n月初数据汇总  →  目标达成率分析  →  品线业绩拆解  →  竞品对标分析\n                                        ↓\n输出月度复盘报告  ←  制定下月目标与策略  ←  问题根因分析 | (手册中该流程\n暂无流程图)\n品线运营 | JD-SOP-03 | 京东大促活动执行流程 | 【流程说明】在京东平台大促启动前，完成活动机制确认、利益点梳理、文案设计、推广对接，活动上线后持续监控并完成复盘（来源：颐莲京东大促活动执行规范）\n\n确认活动机制与利益点  →  梳理京东跨店满减/平台券叠加规则  →  编写活动主文案与核心卖点  →  对接设计输出页面视觉\n                                        ↓\n↓\n活动执行与全渠道宣发  ←  上线前逐项检查清单  ←  对接推广资源完成预热  ←  提报平台活动(打标/资源位/秒杀)\n每日监控核心数据(访客/点击/加购/转化)  →  活动下线恢复日常设置  →  整理活动复盘报告 | [JD-SOP-03]\n京东大促活动执行流程\nJD-SOP-04 | 京东店铺推广管理流程 | 【流程说明】统一约束京东平台推广行为，从前期筹备→方案实施→数据复盘全流程管控京准通快车/全站营销/品牌合约/CPS等推广渠道（来源：颐莲京东店铺推广规范）\n\n店长下达推广方向与产品  →  完成市场数据与竞品分析  →  制定推广预算及渠道规划  →  制定货品推广计划\n                                        ↓\n↓\n监控推广进程并优化预算  ←  创建推广计划并添加设置  ←  确认关键词/出价/人群/素材  ←  沟通素材方完成制作\n对比实际数据与预设目标  →  输出书面复盘报告并同步团队 | [JD-SOP-04]\n京东店铺推广管理流程\n京东运营岗 | JD-SOP-05 | 京东店铺日常运营流程 | 【流程说明】京东店铺运营每日/每周/每月全链路标准化操作，涵盖店铺消息处理、活动价格核查、数据维护、广告分析、商品竞品分析、页面优化、供应链管理等（来源：颐莲京东店铺运营规范）\n\n店铺消息处理(咨询/问答/评价/中差评)  →  活动与价格核查(前台售价/优惠券/赠品)  →  运营数据维护(销售额/营销费用/库存)  →  京准通广告投放分析与优化\n                                        ↓\n↓\n入仓物流跟进  ←  补货与下单规划  ←  页面内容优化(主图/详情/卖点)  ←  商品与竞品分析\n采购及退货单处理  →  周度经营数据提报  →  违规与异常订单排查  →  周度入仓规划\n                                        ↓\n月末复盘与下月规划  ←  价格体系维护  ←  月度推广方案制定  ←  店铺促销设置 | [JD-SOP-05]\n京东店铺日常运营流程\nJD-SOP-06 | 京东供应链入仓与库存管理 | 【流程说明】以销售数据/实时库存/在途货品为依据，采控保底预留半个月货品需求制定备货节奏，实现库存动态循环补货（来源：京东文字类内容/附件标准化推进）\n\n每日统计销售与库存数据  →  预测库存周转(可售天数)  →  明确补货产品明细与数量  →  汇总统计提交采购审核\n                                        ↓\n↓\n跟进在途与销售追加补货  ←  对接仓库备货发出  ←  创建旺店通及浪潮出库单  ←  操作后台手动下单\n每周复盘在库/在途/消耗/回款  →  修正系统数据偏差更新备货计划 | (手册中该流程\n暂无流程图)\nJD-SOP-07 | 京东会员精细化运营 | 【流程说明】按用户价值精准分层，制定差异化触达策略，策划常态化会员活动与大促专属玩法，持续监控核心会员指标并优化（来源：附件标准化推进/自营人群评判标准）\n\n按价值分层(新入会/首单/普通/高价值/沉睡/流失)  →  制定分层专属运营策略  →  沉淀精准人群包  →  策划日常会员活动(入会礼/复购/秒杀/积分)\n                                        ↓\n↓\n制定周度/月度触达节奏  ←  对标竞品优化会员策略  ←  监控入会转化/复购/留存等指标  ←  策划大促专属会员玩法(冲刺/折上折/多倍积分)\n店铺AI直播间搭建与配置 | (手册中该流程\n暂无流程图)\n拼多多运营岗 | JD-SOP-08 | 拼多多店铺日常运营流程 | 【流程说明】拼多多店铺全天候标准化运营，涵盖评论回复(3分钟达标)、活动核查、数据维护、发货履约(48h)、推广分析、竞品追踪、库存监控（来源：颐莲拼多多店铺运营规范）\n\n评论及咨询回复(3分钟达标/中差评24h处理)  →  活动页面核查(秒杀/特卖/百亿补贴)  →  运营数据维护(销售/旺店通发货数据)  →  订单发货履约(48h单号+24h揽收)\n                                        ↓\n↓\n库存备货监控(7日销量/爆款/滞销)  ←  店铺与竞品分析  ←  推广数据分析(多多搜索/全站/ROI)  ←  售后退货处理(审核/退款/换货)\n周度经营数据提报与促销设置  →  月度运营规划与复盘 | (手册中该流程\n暂无流程图)\n唯品会运营岗 | JD-SOP-09 | 唯品会店铺日常运营流程 | 【流程说明】唯品会特卖档期全流程运营，涵盖每日数据跟进、活动核查、价格力系统监控、发货跟踪、变扣审核、周度活动提报、月度财务结算与推广复盘（来源：颐莲唯品会店铺运营流程规范）\n\n店铺数据跟进(销售额/营销费/库存)  →  每日活动页面核查(售价/活动上线)  →  爬虫价格力系统异常处理  →  发货系统监控(订单发货/异常)\n                                        ↓\n↓\n周维度活动提报(周末特卖/限秒/狂秒)  ←  作业邮件处理  ←  商品管控及按灯处理  ←  变扣系统审核清单确认\n虚拟直播开播与红包设置  →  中台策略/会员/超V活动提报  →  唯享客活动提报(佣金/团长)  →  官播与达播活动提报\n                                        ↓\n月度总结规划  ←  财务账单统计(物流/推广/结算) | (手册中该流程\n暂无流程图)", "kpiStandards": "京东拓展负责人 | 回款达成率 | 实际回款/目标回款×100%，月度考核≥95% | 京东商智后台\n利润达成率 | 实际利润/目标利润×100%，月度考核≥90% | 财务对账单\n渠道市占率 | 京东GMV/品牌全渠道GMV×100%，月度监测 | 商智+全渠道数据\n自营同比增速 | 自营(券后)成交额同比，目标≥15% | 京东商智\nPOP同比增速 | POP店成交额同比，目标≥0%(止跌) | 京东商智\n推广费比 | 推广费用/回款金额×100%，控制在15%以内 | 京准通+财务\n库存周转天数 | 平均库存/日均销量，目标≤45天 | 旺店通+供应链报表\n团队目标达成率 | 团队成员人均KPI得分/100×100%，目标≥85% | 绩效考核表\n品线运营 | 品线达成率 | 各品线GMV/目标GMV×100%，喷雾≥100%/嘭润≥95%/新品≥80% | 京东商智\n推广ROI | 推广GMV/推广花费，京东≥3.0 | 京准通后台\n回款达成率 | 品线实际回款/目标回款×100%，月度≥95% | 财务对账单\n品线利润达成率 | 品线毛利/目标毛利×100% | 财务系统\n滞销品占比 | 90天零销量SKU数/总SKU数×100%，目标≤5% | 旺店通库存报表\n京东运营岗 | 店铺GMV达成率 | 实际成交额/目标成交额×100%，月度考核≥100% | 京东商智\n推广ROI | 推广GMV/推广花费，京准通快车≥3.0/全站营销≥2.5 | 京准通后台\nCPS推广ROI | CPS产出/佣金支出，目标≥8.0 | 京挑客后台\n客单价 | 成交额/成交笔数，目标≥75元 | 京东商智\n转化率 | 下单人数/访客数×100% | 京东商智\n店铺风向标得分 | 京东店铺综合服务评分，目标≥90%行业排名 | 京东商家后台\n现货率 | 可售SKU数/总SKU数×100%，目标≥90% | 供应链报表\n库存周转天数 | 平均库存/日均销量，自营≤35天 | 旺店通\n入会转化率 | 新入会人数/访客数×100%，目标≥3% | 京东会员中心\n会员销售占比 | 会员GMV/店铺总GMV×100%，目标≥45% | 京东会员中心\nPLUS会员销售占比 | PLUS会员GMV/店铺总GMV×100% | 京东商智\n复购率 | 复购人数/总购买人数×100%，目标≥25% | 京东商智+会员中心\n新客占比 | 新客GMV/总GMV×100%，目标≥60% | 京东商智\n退换货率 | 退换货单量/总订单量×100%，目标≤8% | 京东商家后台\nCPS推广成交占比 | CPS成交/总GMV×100% | 京挑客\n百补/秒杀成交占比 | 百补+秒杀GMV/总GMV×100% | 京东商智\n拼多多运营岗 | 店铺GMV达成率 | 实际成交/目标成交×100% | 拼多多商家后台\n推广ROI | 推广GMV/推广花费，目标≥4.6 | 多多推广后台\n回款达成率 | 实际回款/目标回款×100% | 财务对账单\n3分钟回复率 | 8:00-24:00核心时段，目标≥95% | 品分析  →  制定推广预算及渠道规划  →  制定货品推广计划\n                                        ↓\n↓\n监控推广进程并优化预算  ←  创建推广计划并添加设置  ←  确认关键词/出价/人群/素材  ←  沟通素材方完成制作\n对比实际数据与预设目标  →  输出书面复盘报告并同步团队 | [JD-SOP-04]\n京东店铺推广管理流程\n京东运营岗 | JD-SOP-05 | 京东店铺日常运营流程 | 【流程说明】京东店铺运营每日/每周/每月全链路标准化操作，涵盖店铺消息处理、活动价格核查、数据维护、广告分析、商品竞品分析、页面优化、供应链管理等（来源：颐莲京东店铺运营规范）\n\n店铺消息处理(咨询/问答/评价/中差评)  →  活动与价格核查(前台售价/优惠券/赠品)  →  运营数据维护(销售额/营销费用/库存)  →  京准通广告投放分析与优化\n                                        ↓\n↓\n入仓物流跟进  ←  补货与下单规划  ←  页面内容优化(主图/详情/卖点)  ←  商品与竞品分析\n采购及退货单处理  →  周度经营数据提报  →  违规与异常订单排查  →  周度入仓规划\n                                        ↓\n月末复盘与下月规划  ←  价格体系维护  ←  月度推广方案制定  ←  店铺促销设置 | [JD-SOP-05]\n京东店铺日常运营流程\nJD-SOP-06 | 京东供应链入仓与库存管理 | 【流程说明】以销售数据/实时库存/在途货品为依据，采控保底预留半个月货品需求制定备货节奏，实现库存动态循环补货（来源：京东文字类内容/附件标准化推进）\n\n每日统计销售与库存数据  →  预测库存周转(可售天数)  →  明确补货产品明细与数量  →  汇总统计提交采购审核\n                                        ↓\n↓\n跟进在途与销售追加补货  ←  对接仓库备货发出  ←  创建旺店通及浪潮出库单  ←  操作后台手动下单\n每周复盘在库/在途/消耗/回款  →  修正系统数据偏差更新备货计划 | (手册中该流程\n暂无流程图)\nJD-SOP-07 | 京东会员精细化运营 | 【流程说明】按用户价值精准分层，制定差异化触达策略，策划常态化会员活动与大促专属玩法，持续监控核心会员指标并优化（来源：附件标准化推进/自营人群评判标准）\n\n按价值分层(新入会/首单/普通/高价值/沉睡/流失)  →  制定分层专属运营策略  →  沉淀精准人群包  →  策划日常会员活动(入会礼/复购/秒杀/积分)\n                                        ↓\n↓\n制定周度/月度触达节奏  ←  对标竞品优化会员策略  ←  监控入会转化/复购/留存等指标  ←  策划大促专属会员玩法(冲刺/折上折/多倍积分)\n店铺AI直播间搭建与配置 | (手册中该流程\n暂无流程图)\n拼多多运营岗 | JD-SOP-08 | 拼多多店铺日常运营流程 | 【流程说明】拼多多店铺全天候标准化运营，涵盖评论回复(3分钟达标)、活动核查、数据维护、发货履约(48h)、推广分析、竞品追踪、库存监控（来源：颐莲拼多多店铺运营规范）\n\n评论及咨询回复(3分钟达标/中差评24h处理)  →  活动页面核查(秒杀/特卖/百亿补贴)  →  运营数据维护(销售/旺店通发货数据)  →  订单发货履约(48h单号+24h揽收)\n                                        ↓\n↓\n库存备货监控(7日销量/爆款/滞销)  ←  店铺与竞品分析  ←  推广数据分析(多多搜索/全站/ROI)  ←  售后退货处理(审核/退款/换货)\n周度经营数据提报与促销设置  →  月度运营规划与复盘 | (手册中该流程\n暂无流程图)\n唯品会运营岗 | JD-SOP-09 | 唯品会店铺日常运营流程 | 【流程说明】唯品会特卖档期全流程运营，涵盖每日数据跟进、活动核查、价格力系统监控、发货跟踪、变扣审核、周度活动提报、月度财务结算与推广复盘（来源：颐莲唯品会店铺运营流程规范）\n\n店铺数据跟进(销售额/营销费/库存)  →  每日活动页面核查(售价/活动上线)  →  爬虫价格力系统异常处理  →  发货系统监控(订单发货/异常)\n                                        ↓\n↓\n周维度活动提报(周末特卖/限秒/狂秒)  ←  作业邮件处理  ←  商品管控及按灯处理  ←  变扣系统审核清单确认\n虚拟直播开播与红包设置  →  中台策略/会员/超V活动提报  →  唯享客活动提报(佣金/团长)  →  官播与达播活动提报\n                                        ↓\n月度总结规划  ←  财务账单统计(物流/推广/结算) | (手册中该流程\n暂无流程图)", "kpiStandards": "京东拓展负责人 | 回款达成率 | 实际回款/目标回款×100%，月度考核≥95% | 京东商智后台\n利润达成率 | 实际利润/目标利润×100%，月度考核≥90% | 财务对账单\n渠道市占率 | 京东GMV/品牌全渠道GMV×100%，月度监测 | 商智+全渠道数据\n自营同比增速 | 自营(券后)成交额同比，目标≥15% | 京东商智\nPOP同比增速 | POP店成交额同比，目标≥0%(止跌) | 京东商智\n推广费比 | 推广费用/回款金额×100%，控制在15%以内 | 京准通+财务\n库存周转天数 | 平均库存/日均销量，目标≤45天 | 旺店通+供应链报表\n团队目标达成率 | 团队成员人均KPI得分/100×100%，目标≥85% | 绩效考核表\n品线运营 | 品线达成率 | 各品线GMV/目标GMV×100%，喷雾≥100%/嘭润≥95%/新品≥80% | 京东商智\n推广ROI | 推广GMV/推广花费，京东≥3.0 | 京准通后台\n回款达成率 | 品线实际回款/目标回款×100%，月度≥95% | 财务对账单\n品线利润达成率 | 品线毛利/目标毛利×100% | 财务系统\n滞销品占比 | 90天零销量SKU数/总SKU数×100%，目标≤5% | 旺店通库存报表\n京东运营岗 | 店铺GMV达成率 | 实际成交额/目标成交额×100%，月度考核≥100% | 京东商智\n推广ROI | 推广GMV/推广花费，京准通快车≥3.0/全站营销≥2.5 | 京准通后台\nCPS推广ROI | CPS产出/佣金支出，目标≥8.0 | 京挑客后台\n客单价 | 成交额/成交笔数，目标≥75元 | 京东商智\n转化率 | 下单人数/访客数×100% | 京东商智\n店铺风向标得分 | 京东店铺综合服务评分，目标≥90%行业排名 | 京东商家后台\n现货率 | 可售SKU数/总SKU数×100%，目标≥90% | 供应链报表\n库存周转天数 | 平均库存/日均销量，自营≤35天 | 旺店通\n入会转化率 | 新入会人数/访客数×100%，目标≥3% | 京东会员中心\n会员销售占比 | 会员GMV/店铺总GMV×100%，目标≥45% | 京东会员中心\nPLUS会员销售占比 | PLUS会员GMV/店铺总GMV×100% | 京东商智\n复购率 | 复购人数/总购买人数×100%，目标≥25% | 京东商智+会员中心\n新客占比 | 新客GMV/总GMV×100%，目标≥60% | 京东商智\n退换货率 | 退换货单量/总订单量×100%，目标≤8% | 京东商家后台\nCPS推广成交占比 | CPS成交/总GMV×100% | 京挑客\n百补/秒杀成交占比 | 百补+秒杀GMV/总GMV×100% | 京东商智\n拼多多运营岗 | 店铺GMV达成率 | 实际成交/目标成交×100% | 拼多多商家后台\n推广ROI | 推广GMV/推广花费，目标≥4.6 | 多多推广后台\n回款达成率 | 实际回款/目标回款×100% | 财务对账单\n3分钟回复率 | 8:00-24:00核心时段，目标≥95% | 拼多多商家后台\n48h发货率 | 48h内发货订单/总订单×100%，目标≥98% | 拼多多商家后台\n纠纷退款率 | 纠纷退款单/总订单×100%，目标≤1% | 拼多多商家后台\n唯品会运营岗 | 档期GMV达成率 | 实际GMV/目标GMV×100% | 唯品会BI\n推广ROI | 推广GMV/推广花费，目标≥3.7 | 唯品会投放后台\n回款达成率 | 实际回款/目标回款×100% | 财务对账单\n售罄率 | 已售库存/总库存×100%，目标≥70% | 唯品会BI\n毛利率 | 毛利/成交额×100%，目标≥35% | 财务系统\nSVIP会员GMV占比 | 超级VIP成交/总GMV×100% | 唯品会BI\n退换货率 | 退换货/总发货×100%，目标≤10% | 唯品会后台"}, "workStandardSections": [{"title": "一、京东运营规范", "items": [{"title": "1.1 京东大促活动执行规范", "image": "./ws-images/ws_img_24.png", "content": ""}, {"title": "1.2 京东店铺推广规范", "image": "./ws-images/ws_img_25.png", "content": ""}, {"title": "1.3 京东店铺运营规范", "image": "./ws-images/ws_img_26.png", "content": ""}]}], "kpiWeights": ""}, {"name": "拼多多运营岗", "count": 2, "people": [{"name": "品牌官旗店店长 王亚庆", "kpi": "渠道达成30%；回款达成30%；利润达成25%；货品指标 喷雾品线*0.4+多多单品*0.6 10%；投产 5%", "shops": ["颐莲旗舰店-拼多多", "颐莲官方旗舰店-拼多多", "颐莲护肤官方旗舰店-拼多多"]}, {"name": "店铺运营 张雨", "kpi": "待定", "shops": ["颐莲旗舰店-拼多多", "颐莲官方旗舰店-拼多多", "颐莲护肤官方旗舰店-拼多多"]}], "details": {"jobResponsibilities": "销售目标达成与全周期活动运营\n策划并落地拼多多店铺全周期营销活动，重点跟进百亿补贴、限时秒杀等平台核心活动，协同推广团队匹配投放策略，完成店铺日/周/月/年度GMV、利润；负责大促活动全流程落地，包含活动报名竞价、坑位争取、方案制定、跨团队对接、过程优化与复盘总结。\n\n店铺日常数据监控与分析\n每日对拼多多店铺核心运营数据进行全维度分析，涵盖流量、客单价、转化率、单品表现等核心维度，及时发现数据异常并同步沟通。\n\n店铺基础运营与客诉管控\n负责拼多多店铺日常基础运营维护，包含商品信息维护、店铺页面信息更新、订单全流程跟进、售后问题处理等全链路工作，保障店铺正常合规运营。\n\n推广投放管控与营销创新\n根据各阶段销售计划，统筹付费推广投放，严格管控推广ROI投产水平；同时负责多多进宝CPS渠道运营，拓展优质团长资源，持续挖掘新型营销玩法，拓宽店铺引流渠道，提升整体流量转化收益。\n\n行业与竞品动态跟踪分析\n持续收集、整理拼多多平台行业发展趋势、类目规则变化及竞争对手的运营、定价、推广动作信息，重点监控同款竞品的价格调整、百亿补贴报名、多多进宝策略等动作，输出分析结论并推动店铺运营/推广策略快速调整优化。", "jobRequirements": "专科及以上，市场营销、电商、传媒相关专业，1年以上美妆或相关行业电商运营经验，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。", "workProcess": "拓展平台 | 负责人 | 每日\n每周\n每月\n品线运营 | 每日 | 1.跟进店铺流量、成交、货品数据，数据异常即时上报\n2.跟进品线 达成、 会员/PLUS成交\n3.监控推广投产 ROI，同步推广优化需求\n每周 | 1.跟进周销售、利润、货品目标进度\n2.复盘推广、用户、货品数据，针对滞销品线调整运营策略\n3.核对库存周转，分品线梳理货品需求\n4.梳理活动排期，对接设计、客服落实素材与售后预案\n每月 | 1.完成月度销售数据汇总与业绩复盘，拆分各品线业绩完成情况\n2.跟进竞品情况，对标竞品品类打法优化自有品线运营方案\n3.盘点全渠道库存，统筹各品线库存、备货规划\n京东运营岗 | 每日 | 1. 跟进流量、成交、货品数据，异常即时上报\n2. 巡检商品价格、库存、页面信息，完成上下架调整\n3. 跟进会员/PLUS成交，处理用户咨询投诉\n4. 监控推广投产，同步推广优化需求\n每周 | 1. 跟进周销售、利润、货品目标进度\n2. 复盘推广、用户、货品数据，调整策略\n3. 核对库存周转，提交货品调拨需求\n4. 梳理下周活动排期，对接设计、客服\n每月 | 1. 完成月度销售数据汇总与业绩复盘\n2. 输出竞品分析报告，优化运营方案\n3. 盘点全渠道库存\n拼多多运营岗 | 每日 | 1. 跟进统计成交、投产，异常即时上报\n2. 巡检百亿补贴、商品库存与售价\n3. 监控全站推广、多多进宝ROI\n4. 盯竞品低价与秒杀活动策略\n每周 | 1.跟进回款、利润周考核目标\n2. 核查销量缺口，加投或做活动\n3. 收集竞品补贴、佣金政策信息\n4. 规划下周秒杀、资源位排期\n每月 | 1. 制定投放、活动月度方案\n2. 复盘指标缺口，落地补量方案\n3. 输出月度竞品分析\n4. 月度全盘复盘，规划下月打法\n唯品会运营岗 | 每日 | 1. 跟进档期成交、毛利，数据异常及时上报\n2. 巡检特卖商品、库存与限价合规情况\n3. 监控站内投放，跟进推广投产达标\n4. 处理售后差评，维护SVIP高价值会员\n5. 调研竞品档期折扣、清仓策略\n每周 | 1. 跟进周回款、毛利、考核指标\n2. 核对档期缺口，申请平台资源位\n3. 关注竞品特卖价格与活动打法\n每月 | 1. 制定月度档期、投放方案\n2. 复盘指标缺口，调整折扣力度\n3. 输出月度竞品分析报告\n4. 月度全盘复盘，规划下月货品结构", "workStandards": "京东拓展负责人 | JD-SOP-01 | 年度预算计划制定与拆解 | 【流程说明】依据公司年度战略目标，结合京东自营+POP渠道历史销售数据、平台资源规划，制定京东渠道年度预算及月度拆解方案\n\n通知全年预算制定原则  →  各渠道提交预算初稿  →  京东拓展负责人审核  →  事业部汇总审核\n                                        ↓\n月度预算执行跟踪  ←  下发月度拆解任务  ←  公司高层审批 | (手册中该流程\n暂无流程图)\nJD-SOP-02 | 京东渠道月度运营复盘 | 【流程说明】每月汇总京东自营+POP渠道销售、利润、推广ROI、库存周转等核心指标，输出月度复盘报告并制定下月运营规划\n\n月初数据汇总  →  目标达成率分析  →  品线业绩拆解  →  竞品对标分析\n                                        ↓\n输出月度复盘报告  ←  制定下月目标与策略  ←  问题根因分析 | (手册中该流程\n暂无流程图)\n品线运营 | JD-SOP-03 | 京东大促活动执行流程 | 【流程说明】在京东平台大促启动前，完成活动机制确认、利益点梳理、文案设计、推广对接，活动上线后持续监控并完成复盘（来源：颐莲京东大促活动执行规范）\n\n确认活动机制与利益点  →  梳理京东跨店满减/平台券叠加规则  →  编写活动主文案与核心卖点  →  对接设计输出页面视觉\n                                        ↓\n↓\n活动执行与全渠道宣发  ←  上线前逐项检查清单  ←  对接推广资源完成预热  ←  提报平台活动(打标/资源位/秒杀)\n每日监控核心数据(访客/点击/加购/转化)  →  活动下线恢复日常设置  →  整理活动复盘报告 | [JD-SOP-03]\n京东大促活动执行流程\nJD-SOP-04 | 京东店铺推广管理流程 | 【流程说明】统一约束京东平台推广行为，从前期筹备→方案实施→数据复盘全流程管控京准通快车/全站营销/品牌合约/CPS等推广渠道（来源：颐莲京东店铺推广规范）\n\n店长下达推广方向与产品  →  完成市场数据与竞品分析  →  制定推广预算及渠道规划  →  制定货品推广计划\n                                        ↓\n↓\n监控推广进程并优化预算  ←  创建推广计划并添加设置  ←  确认关键词/出价/人群/素材  ←  沟通素材方完成制作\n对比实际数据与预设目标  →  输出书面复盘报告并同步团队 | [JD-SOP-04]\n京东店铺推广管理流程\n京东运营岗 | JD-SOP-05 | 京东店铺日常运营流程 | 【流程说明】京东店铺运营每日/每周/每月全链路标准化操作，涵盖店铺消息处理、活动价格核查、数据维护、广告分析、商品竞品分析、页面优化、供应链管理等（来源：颐莲京东店铺运营规范）\n\n店铺消息处理(咨询/问答/评价/中差评)  →  活动与价格核查(前台售价/优惠券/赠品)  →  运营数据维护(销售额/营销费用/库存)  →  京准通广告投放分析与优化\n                                        ↓\n↓\n入仓物流跟进  ←  补货与下单规划  ←  页面内容优化(主图/详情/卖点)  ←  商品与竞品分析\n采购及退货单处理  →  周度经营数据提报  →  违规与异常订单排查  →  周度入仓规划\n                                        ↓\n月末复盘与下月规划  ←  价格体系维护  ←  月度推广方案制定  ←  店铺促销设置 | [JD-SOP-05]\n京东店铺日常运营流程\nJD-SOP-06 | 京东供应链入仓与库存管理 | 【流程说明】以销售数据/实时库存/在途货品为依据，采控保底预留半个月货品需求制定备货节奏，实现库存动态循环补货（来源：京东文字类内容/附件标准化推进）\n\n每日统计销售与库存数据  →  预测库存周转(可售天数)  →  明确补货产品明细与数量  →  汇总统计提交采购审核\n                                        ↓\n↓\n跟进在途与销售追加补货  ←  对接仓库备货发出  ←  创建旺店通及浪潮出库单  ←  操作后台手动下单\n每周复盘在库/在途/消耗/回款  →  修正系统数据偏差更新备货计划 | (手册中该流程\n暂无流程图)\nJD-SOP-07 | 京东会员精细化运营 | 【流程说明】按用户价值精准分层，制定差异化触达策略，策划常态化会员活动与大促专属玩法，持续监控核心会员指标并优化（来源：附件标准化推进/自营人群评判标准）\n\n按价值分层(新入会/首单/普通/高价值/沉睡/流失)  →  制定分层专属运营策略  →  沉淀精准人群包  →  策划日常会员活动(入会礼/复购/秒杀/积分)\n                                        ↓\n↓\n制定周度/月度触达节奏  ←  对标竞品优化会员策略  ←  监控入会转化/复购/留存等指标  ←  策划大促专属会员玩法(冲刺/折上折/多倍积分)\n店铺AI直播间搭建与配置 | (手册中该流程\n暂无流程图)\n拼多多运营岗 | JD-SOP-08 | 拼多多店铺日常运营流程 | 【流程说明】拼多多店铺全天候标准化运营，涵盖评论回复(3分钟达标)、活动核查、数据维护、发货履约(48h)、推广分析、竞品追踪、库存监控（来源：颐莲拼多多店铺运营规范）\n\n评论及咨询回复(3分钟达标/中差评24h处理)  →  活动页面核查(秒杀/特卖/百亿补贴)  →  运营数据维护(销售/旺店通发货数据)  →  订单发货履约(48h单号+24h揽收)\n                                        ↓\n↓\n库存备货监控(7日销量/爆款/滞销)  ←  店铺与竞品分析  ←  推广数据分析(多多搜索/全站/ROI)  ←  售后退货处理(审核/退款/换货)\n周度经营数据提报与促销设置  →  月度运营规划与复盘 | (手册中该流程\n暂无流程图)\n唯品会运营岗 | JD-SOP-09 | 唯品会店铺日常运营流程 | 【流程说明】唯品会特卖档期全流程运营，涵盖每日数据跟进、活动核查、价格力系统监控、发货跟踪、变扣审核、周度活动提报、月度财务结算与推广复盘（来源：颐莲唯品会店铺运营流程规范）\n\n店铺数据跟进(销售额/营销费/库存)  →  每日活动页面核查(售价/活动上线)  →  爬虫价格力系统异常处理  →  发货系统监控(订单发货/异常)\n                                        ↓\n↓\n周维度活动提报(周末特卖/限秒/狂秒)  ←  作业邮件处理  ←  商品管控及按灯处理  ←  变扣系统审核清单确认\n虚拟直播开播与红包设置  →  中台策略/会员/超V活动提报  →  唯享客活动提报(佣金/团长)  →  官播与达播活动提报\n                                        ↓\n月度总结规划  ←  财务账单统计(物流/推广/结算) | (手册中该流程\n暂无流程图)", "kpiStandards": "京东拓展负责人 | 回款达成率 | 实际回款/目标回款×100%，月度考核≥95% | 京东商智后台\n利润达成率 | 实际利润/目标利润×100%，月度考核≥90% | 财务对账单\n渠道市占率 | 京东GMV/品牌全渠道GMV×100%，月度监测 | 商智+全渠道数据\n自营同比增速 | 自营(券后)成交额同比，目标≥15% | 京东商智\nPOP同比增速 | POP店成交额同比，目标≥0%(止跌) | 京东商智\n推广费比 | 推广费用/回款金额×100%，控制在15%以内 | 京准通+财务\n库存周转天数 | 平均库存/日均销量，目标≤45天 | 旺店通+供应链报表\n团队目标达成率 | 团队成员人均KPI得分/100×100%，目标≥85% | 绩效考核表\n品线运营 | 品线达成率 | 各品线GMV/目标GMV×100%，喷雾≥100%/嘭润≥95%/新品≥80% | 京东商智\n推广ROI | 推广GMV/推广花费，京东≥3.0 | 京准通后台\n回款达成率 | 品线实际回款/目标回款×100%，月度≥95% | 财务对账单\n品线利润达成率 | 品线毛利/目标毛利×100% | 财务系统\n滞销品占比 | 90天零销量SKU数/总SKU数×100%，目标≤5% | 旺店通库存报表\n京东运营岗 | 店铺GMV达成率 | 实际成交额/目标成交额×100%，月度考核≥100% | 京东商智\n推广ROI | 推广GMV/推广花费，京准通快车≥3.0/全站营销≥2.5 | 京准通后台\nCPS推广ROI | CPS产出/佣金支出，目标≥8.0 | 京挑客后台\n客单价 | 成交额/成交笔数，目标≥75元 | 京东商智\n转化率 | 下单人数/访客数×100% | 京东商智\n店铺风向标得分 | 京东店铺综合服务评分，目标≥90%行业排名 | 京东商家后台\n现货率 | 可售SKU数/总SKU数×100%，目标≥90% | 供应链报表\n库存周转天数 | 平均库存/日均销量，自营≤35天 | 旺店通\n入会转化率 | 新入会人数/访客数×100%，目标≥3% | 京东会员中心\n会员销售占比 | 会员GMV/店铺总GMV×100%，目标≥45% | 京东会员中心\nPLUS会员销售占比 | PLUS会员GMV/店铺总GMV×100% | 京东商智\n复购率 | 复购人数/总购买人数×100%，目标≥25% | 京东商智+会员中心\n新客占比 | 新客GMV/总GMV×100%，目标≥60% | 京东商智\n退换货率 | 退换货单量/总订单量×100%，目标≤8% | 京东商家后台\nCPS推广成交占比 | CPS成交/总GMV×100% | 京挑客\n百补/秒杀成交占比 | 百补+秒杀GMV/总GMV×100% | 京东商智\n拼多多运营岗 | 店铺GMV达成率 | 实际成交/目标成交×100% | 拼多多商家后台\n推广ROI | 推广GMV/推广花费，目标≥4.6 | 多多推广后台\n回款达成率 | 实际回款/目标回款×100% | 财务对账单\n3分钟回复率 | 8:00-24:00核心时段，目标≥95% | 拼多多商家后台\n48h发货率 | 48h内发货订单/总订单×100%，目标≥98% | 拼多多商家后台\n纠纷退款率 | 纠纷退款单/总订单×100%，目标≤1% | 拼多多商家后台\n唯品会运营岗 | 档期GMV达成率 | 实际GMV/目标GMV×100% | 唯品会BI\n推广ROI | 推广GMV/推广花费，目标≥3.7 | 唯品会投放后台\n回款达成率 | 实际回款/目标回款×100% | 财务对账单\n售罄率 | 已售库存/总库存×100%，目标≥70% | 唯品会BI\n毛利率 | 毛利/成交额×100%，目标≥35% | 财务系统\nSVIP会员GMV占比 | 超级VIP成交/总GMV×100% | 唯品会BI\n退换货率 | 退换货/总发货×100%，目标≤10% | 唯品会后台"}, "workStandardSections": [{"title": "一、拼多多运营规范", "items": [{"title": "1.1 拼多多店铺运营规范", "image": "./ws-images/ws_img_27.png", "content": ""}, {"title": "1.2 拼多多推广运营规范", "image": "./ws-images/ws_img_28.png", "content": ""}]}], "kpiWeights": ""}, {"name": "唯品会运营岗", "count": 2, "people": [{"name": "品牌官旗店店长 吴臣", "kpi": "渠道达成30%；回款达成25%；利润达成25%；货品指标15%；投产 5%", "shops": ["唯品会(中国)有限公司"]}, {"name": "店铺运营 赵晓蕾", "kpi": "待定", "shops": ["唯品会(中国)有限公司"]}], "details": {"jobResponsibilities": "销售目标达成与全周期活动运营\n负责唯品会店铺全品类特卖档期的全流程落地，协同推广团队匹配投放策略，完成店铺月度/季度/年度GMV、售罄率、利润；统筹特卖选品、定价、库存规划、档期报名、过程优化与复盘全链路工作，维护品牌在唯品会平台的调性与形象。\n\n店铺日常数据监控与分析\n每日对唯品会店铺核心运营数据进行全维度分析，涵盖流量、客单价、转化率、单品表现等核心维度，及时发现数据异常并同步沟通。\n\n店铺基础运营与客诉管控\n负责唯品会店铺日常基础运营维护，包含商品信息维护、店铺页面信息更新、订单全流程跟进、售后问题处理等全链路工作，保障店铺正常合规运营。\n\n推广投放管控与营销创新\n根据店铺各阶段销售目标与特卖档期节奏，统筹唯品会付费推广投放，严格管控推广ROI投产水平；同时负责内容营销体系搭建，运营超级VIP私域会员体系，持续挖掘平台新型营销玩法，拓宽店铺引流渠道，提升用户复购与全生命周期价值。\n\n行业与竞品动态跟踪分析\n持续收集、整理唯品会平台类目规则变化、行业发展趋势，以及同品类竞品的特卖档期安排、选品结构、推广投放策略等信息，重点监控竞品的品牌评级、售罄率、用户运营动作，输出分析结论并快速调整店铺运营与推广策略，巩固类目竞争优势。\n\n### 京东品牌店店长\n\n**总结**：统筹平台运营，制定策略，监控数据，协调资源。\n\n**解释**：制定并执行年度/月度销售目标与运营策略，每日监控流量、转化率、客单价；统筹大促及日常营销活动，基于用户数据优化人群营销；监测行业竞品，调整运营策略并优化站内付费推广；协同供应链管理库存周转；每月核对财务账单并核销发票；监控客服质量，处理重大客诉；对内协调价格与促销政策，对外对接采销争取资源。\n\n### 京东店铺运营\n\n**总结**：负责采销对接、商品维护、活动策划与数据复盘。\n\n**解释**：对接采销，处理价格异常、库存告急等问题；提报秒杀、超补、试用及大促坑位，跟进资源位，争取外部合作；维护商品信息（主图、详情、关键词），完成新品上架及价格体系设置，动态调整促销；策划小促及大促活动，完成玩法设计、页面搭建及视觉更新；每日跟踪UV、转化率、GMV，异常即时响应；监测竞品并输出对策；完成大促及半年度复盘；协同客服处理差评，优化详情页；维护风向标（评价、物流、售后）；管理补货入仓及滞销清仓；每月核对推广、账扣等费用并核销。\n\n### 京东供应链运营岗\n\n**总结**：负责采购下单、库存管理及新品创建与核销。\n\n**解释**：根据销售与库存预测周转，确定补货明细并提交审核，操作后台下单，创建出库单对接仓库发货，跟进在途并及时追加补货；新品创建时明确机制与采购价，上传主图详情并提交审核；月初核对TC运费账单并完成核销。\n\n### 京东会员运营\n\n**总结**：负责会员体系搭建、活动策划与用户触达。\n\n**解释**：搭建会员体系，按价值分层（新入会、首单、普通、高价值、沉睡、流失、储值）制定运营策略，沉淀人群包；策划日常会员活动（入会礼、复购、秒杀、积分兑换）及大促专属玩法（会员冲刺、折上折、多倍积分等）；监控入会转化、复购、留存等指标，对标竞品优化策略；更新会员页视觉素材；制定周度/月度及大促触达节奏，精准圈选人群差异化推送；制定客服服务标准，收集反馈优化权益；搭建AI直播间，配置商品与优惠，大促编排脚本并配合真人直播。\n\n### 推广运营岗\n\n**总结**：负责站内外推广投放、预算管理与效果优化。\n\n**解释**：负责月度预算请款及发票核销；操作京准通快车、全站营销、品牌合约的全流程搭建与调整，按销售目标分配各渠道预算；每日监控曝光、点击、转化、ROI，优化出价、人群定向及素材；每月复盘并输出优化方案；管理新品、改版等推广素材更新；针对大促及自促活动制定推广方案、申请预算，实时盯盘调整投放，活动后输出复盘；负责站外开屏广告、短信营销，对接灵狐、南讯，圈选人群制作触达内容，监控数据并优化效果。", "jobRequirements": "专科及以上，市场营销、电商、传媒相关专业，1年以上美妆或相关行业电商运营经验，熟练办公、数据分析、社媒运营工具；沟通顺畅且有团队协作意识。", "workProcess": "拓展平台 | 负责人 | 每日\n每周\n每月\n品线运营 | 每日 | 1.跟进店铺流量、成交、货品数据，数据异常即时上报\n2.跟进品线 达成、 会员/PLUS成交\n3.监控推广投产 ROI，同步推广优化需求\n每周 | 1.跟进周销售、利润、货品目标进度\n2.复盘推广、用户、货品数据，针对滞销品线调整运营策略\n3.核对库存周转，分品线梳理货品需求\n4.梳理活动排期，对接设计、客服落实素材与售后预案\n每月 | 1.完成月度销售数据汇总与业绩复盘，拆分各品线业绩完成情况\n2.跟进竞品情况，对标竞品品类打法优化自有品线运营方案\n3.盘点全渠道库存，统筹各品线库存、备货规划\n京东运营岗 | 每日 | 1. 跟进流量、成交、货品数据，异常即时上报\n2. 巡检商品价格、库存、页面信息，完成上下架调整\n3. 跟进会员/PLUS成交，处理用户咨询投诉\n4. 监控推广投产，同步推广优化需求\n每周 | 1. 跟进周销售、利润、货品目标进度\n2. 复盘推广、用户、货品数据，调整策略\n3. 核对库存周转，提交货品调拨需求\n4. 梳理下周活动排期，对接设计、客服\n每月 | 1. 完成月度销售数据汇总与业绩复盘\n2. 输出竞品分析报告，优化运营方案\n3. 盘点全渠道库存\n拼多多运营岗 | 每日 | 1. 跟进统计成交、投产，异常即时上报\n2. 巡检百亿补贴、商品库存与售价\n3. 监控全站推广、多多进宝ROI\n4. 盯竞品低价与秒杀活动策略\n每周 | 1.跟进回款、利润周考核目标\n2. 核查销量缺口，加投或做活动\n3. 收集竞品补贴、佣金政策信息\n4. 规划下周秒杀、资源位排期\n每月 | 1. 制定投放、活动月度方案\n2. 复盘指标缺口，落地补量方案\n3. 输出月度竞品分析\n4. 月度全盘复盘，规划下月打法\n唯品会运营岗 | 每日 | 1. 跟进档期成交、毛利，数据异常及时上报\n2. 巡检特卖商品、库存与限价合规情况\n3. 监控站内投放，跟进推广投产达标\n4. 处理售后差评，维护SVIP高价值会员\n5. 调研竞品档期折扣、清仓策略\n每周 | 1. 跟进周回款、毛利、考核指标\n2. 核对档期缺口，申请平台资源位\n3. 关注竞品特卖价格与活动打法\n每月 | 1. 制定月度档期、投放方案\n2. 复盘指标缺口，调整折扣力度\n3. 输出月度竞品分析报告\n4. 月度全盘复盘，规划下月货品结构", "workStandards": "京东拓展负责人 | JD-SOP-01 | 年度预算计划制定与拆解 | 【流程说明】依据公司年度战略目标，结合京东自营+POP渠道历史销售数据、平台资源规划，制定京东渠道年度预算及月度拆解方案\n\n通知全年预算制定原则  →  各渠道提交预算初稿  →  京东拓展负责人审核  →  事业部汇总审核\n                                        ↓\n月度预算执行跟踪  ←  下发月度拆解任务  ←  公司高层审批 | (手册中该流程\n暂无流程图)\nJD-SOP-02 | 京东渠道月度运营复盘 | 【流程说明】每月汇总京东自营+POP渠道销售、利润、推广ROI、库存周转等核心指标，输出月度复盘报告并制定下月运营规划\n\n月初数据汇总  →  目标达成率分析  →  品线业绩拆解  →  竞品对标分析\n                                        ↓\n输出月度复盘报告  ←  制定下月目标与策略  ←  问题根因分析 | (手册中该流程\n暂无流程图)\n品线运营 | JD-SOP-03 | 京东大促活动执行流程 | 【流程说明】在京东平台大促启动前，完成活动机制确认、利益点梳理、文案设计、推广对接，活动上线后持续监控并完成复盘（来源：颐莲京东大促活动执行规范）\n\n确认活动机制与利益点  →  梳理京东跨店满减/平台券叠加规则  →  编写活动主文案与核心卖点  →  对接设计输出页面视觉\n                                        ↓\n↓\n活动执行与全渠道宣发  ←  上线前逐项检查清单  ←  对接推广资源完成预热  ←  提报平台活动(打标/资源位/秒杀)\n每日监控核心数据(访客/点击/加购/转化)  →  活动下线恢复日常设置  →  整理活动复盘报告 | [JD-SOP-03]\n京东大促活动执行流程\nJD-SOP-04 | 京东店铺推广管理流程 | 【流程说明】统一约束京东平台推广行为，从前期筹备→方案实施→数据复盘全流程管控京准通快车/全站营销/品牌合约/CPS等推广渠道（来源：颐莲京东店铺推广规范）\n\n店长下达推广方向与产品  →  完成市场数据与竞品分析  →  制定推广预算及渠道规划  →  制定货品推广计划\n                                        ↓\n↓\n监控推广进程并优化预算  ←  创建推广计划并添加设置  ←  确认关键词/出价/人群/素材  ←  沟通素材方完成制作\n对比实际数据与预设目标  →  输出书面复盘报告并同步团队 | [JD-SOP-04]\n京东店铺推广管理流程\n京东运营岗 | JD-SOP-05 | 京东店铺日常运营流程 | 【流程说明】京东店铺运营每日/每周/每月全链路标准化操作，涵盖店铺消息处理、活动价格核查、数据维护、广告分析、商品竞品分析、页面优化、供应链管理等（来源：颐莲京东店铺运营规范）\n\n店铺消息处理(咨询/问答/评价/中差评)  →  活动与价格核查(前台售价/优惠券/赠品)  →  运营数据维护(销售额/营销费用/库存)  →  京准通广告投放分析与优化\n                                        ↓\n↓\n入仓物流跟进  ←  补货与下单规划  ←  页面内容优化(主图/详情/卖点)  ←  商品与竞品分析\n采购及退货单处理  →  周度经营数据提报  →  违规与异常订单排查  →  周度入仓规划\n                                        ↓\n月末复盘与下月规划  ←  价格体系维护  ←  月度推广方案制定  ←  店铺促销设置 | [JD-SOP-05]\n京东店铺日常运营流程\nJD-SOP-06 | 京东供应链入仓与库存管理 | 【流程说明】以销售数据/实时库存/在途货品为依据，采控保底预留半个月货品需求制定备货节奏，实现库存动态循环补货（来源：京东文字类内容/附件标准化推进）\n\n每日统计销售与库存数据  →  预测库存周转(可售天数)  →  明确补货产品明细与数量  →  汇总统计提交采购审核\n                                        ↓\n↓\n跟进在途与销售追加补货  ←  对接仓库备货发出  ←  创建旺店通及浪潮出库单  ←  操作后台手动下单\n每周复盘在库/在途/消耗/回款  →  修正系统数据偏差更新备货计划 | (手册中该流程\n暂无流程图)\nJD-SOP-07 | 京东会员精细化运营 | 【流程说明】按用户价值精准分层，制定差异化触达策略，策划常态化会员活动与大促专属玩法，持续监控核心会员指标并优化（来源：附件标准化推进/自营人群评判标准）\n\n按价值分层(新入会/首单/普通/高价值/沉睡/流失)  →  制定分层专属运营策略  →  沉淀精准人群包  →  策划日常会员活动(入会礼/复购/秒杀/积分)\n                                        ↓\n↓\n制定周度/月度触达节奏  ←  对标竞品优化会员策略  ←  监控入会转化/复购/留存等指标  ←  策划大促专属会员玩法(冲刺/折上折/多倍积分)\n店铺AI直播间搭建与配置 | (手册中该流程\n暂无流程图)\n拼多多运营岗 | JD-SOP-08 | 拼多多店铺日常运营流程 | 【流程说明】拼多多店铺全天候标准化运营，涵盖评论回复(3分钟达标)、活动核查、数据维护、发货履约(48h)、推广分析、竞品追踪、库存监控（来源：颐莲拼多多店铺运营规范）\n\n评论及咨询回复(3分钟达标/中差评24h处理)  →  活动页面核查(秒杀/特卖/百亿补贴)  →  运营数据维护(销售/旺店通发货数据)  →  订单发货履约(48h单号+24h揽收)\n                                        ↓\n↓\n库存备货监控(7日销量/爆款/滞销)  ←  店铺与竞品分析  ←  推广数据分析(多多搜索/全站/ROI)  ←  售后退货处理(审核/退款/换货)\n周度经营数据提报与促销设置  →  月度运营规划与复盘 | (手册中该流程\n暂无流程图)\n唯品会运营岗 | JD-SOP-09 | 唯品会店铺日常运营流程 | 【流程说明】唯品会特卖档期全流程运营，涵盖每日数据跟进、活动核查、价格力系统监控、发货跟踪、变扣审核、周度活动提报、月度财务结算与推广复盘（来源：颐莲唯品会店铺运营流程规范）\n\n店铺数据跟进(销售额/营销费/库存)  →  每日活动页面核查(售价/活动上线)  →  爬虫价格力系统异常处理  →  发货系统监控(订单发货/异常)\n                                        ↓\n↓\n周维度活动提报(周末特卖/限秒/狂秒)  ←  作业邮件处理  ←  商品管控及按灯处理  ←  变扣系统审核清单确认\n虚拟直播开播与红包设置  →  中台策略/会员/超V活动提报  →  唯享客活动提报(佣金/团长)  →  官播与达播活动提报\n                                        ↓\n月度总结规划  ←  财务账单统计(物流/推广/结算) | (手册中该流程\n暂无流程图)", "kpiStandards": "京东拓展负责人 | 回款达成率 | 实际回款/目标回款×100%，月度考核≥95% | 京东商智后台\n利润达成率 | 实际利润/目标利润×100%，月度考核≥90% | 财务对账单\n渠道市占率 | 京东GMV/品牌全渠道GMV×100%，月度监测 | 商智+全渠道数据\n自营同比增速 | 自营(券后)成交额同比，目标≥15% | 京东商智\nPOP同比增速 | POP店成交额同比，目标≥0%(止跌) | 京东商智\n推广费比 | 推广费用/回款金额×100%，控制在15%以内 | 京准通+财务\n库存周转天数 | 平均库存/日均销量，目标≤45天 | 旺店通+供应链报表\n团队目标达成率 | 团队成员人均KPI得分/100×100%，目标≥85% | 绩效考核表\n品线运营 | 品线达成率 | 各品线GMV/目标GMV×100%，喷雾≥100%/嘭润≥95%/新品≥80% | 京东商智\n推广ROI | 协作意识。", "workProcess": "【每日】\n1. 负责日常客户订单受理、审核与发货跟进，确保订单24h内发货；处理订单异常及售后退换货问题\n2. 统计各平台及分销商当日销售数据(GMV、订单量、客单价)计算指标达成率，输出日销简报；监控分销商库存周转情况，对低库存提醒补货，识别滞销品上报预警\n3. 办理客户授权手续与资质审核，跟进授权进度确保流程合规；对接分销商日常订货需求与物流状态\n4. 处理分销商及终端消费者咨询与投诉，确保客服响应时效达标；收集客户反馈归类整理，上报异常问题\n\n【每周】\n1. 汇总本周各平台及分销商销售数据分析环比与同比变化，诊断销售波动原因；输出周度销售分析报告并制定下周提升措施\n2. 与核心分销商进行周度沟通了解经营困难与需求，跟进分销商进货达成进度推动缺口补单；检查在执行活动的资源位价格与库存到位情况，跟踪活动期间GMV达成异常及时调整并上报\n3. 汇总本周库存周转及临期滞销品数据，协助执行清仓品促销落地；跟进分销商合同续签与归档进度，确保合同流程闭环\n4. 整理本周竞品价格活动及渠道策略汇总，输出竞品周度分析简报；跟进客户授权台账更新与授信额度使用情况\n\n【每月】\n1. 汇总月度各平台及分销商销售数据对比月度指标达成率，分析达成或未达成原因制定下月改进措施；核算月度渠道返利及各项激励费用，输出费用明细表并提交审批\n2. 执行月度渠道返利订货激励及促销政策，向全部分销商传达政策内容确认签收并监督落地；办理客户年度合同签订续签归档，维护客户授权台账与资质审核\n3. 执行活动档期方案含机制价格物料，跟进活动上线及业绩达成；对接设计需求及物料支持，输出活动复盘数据；完成经销商季度返利测算与核算\n4. 输出月度竞品分析报告涵盖价格带促销策略新品动态及渠道布局，提出本品应对策略建议；汇总月度库存盘点数据及清仓品处理进展，对接供应链补货与调拨计划", "workStandards": "后台可编辑占位", "kpiStandards": "后台可编辑占位"}, "workStandardSections": [{"title": "一、分销全流程标准化 SOP", "items": [{"title": "1.1 分销商引入 SOP", "image": "./ws-images/ws_img_31.png", "content": "按产品品类区分分销商类型（多店铺包销品 / 一般包销品 / 非包销品）→ 多店铺包销品→推荐对应一级分销商对接；一般包销品→对接专属包销商；非包销品→品牌实力、产品标准化宣讲 → 标准化资质审核流程（硬性准入标准）：独立法人、化妆品一般纳税人、非失信企业、签署《分销商合作协议》→ 分销专员/负责人初筛 → 阿里生态负责人复核 → 审批通过后启动商标授权、开通订货系统账号。"}, {"title": "1.2 分销商订单处理 SOP", "image": "./ws-images/ws_img_32.png", "content": "标准化信息采集：统一《分销商信息收集表》采集店铺 ID、链接、渠道经营范围 → 商标授权标准化：统一水印商标模板、限定线上分销使用渠道/期限 → 客户培训标准化：按需启动产品、订货系统、活动政策标准化线下培训流程 → 日常支持标准化 4 项：①活动政策传达；②月度动销数据追踪；③价格异常预警处理；④新品上架同步支持。"}, {"title": "1.3 分销商价格管控 SOP", "image": "./ws-images/ws_img_33.png", "content": "年度标准化控价文件输出：每年年初出具《颐莲品牌产品价格管控表》并全分销商下发 → 日常价格监控标准化双渠道机制：淘系分销专人巡检 + 第三方控价公司同步监控 → 乱价分级标准化处置流程（固定闭环）：1）首次乱价：下发调价通知，限期整改；2）二次乱价：扣除对应保证金并出具书面警告；3）三次乱价：直接终止合作并启动分销商退出 SOP。"}, {"title": "1.4 分销商退出 SOP", "image": "./ws-images/ws_img_34.png", "content": "标准化退出双触发场景（分销商自主申请 / 公司考核违规终止）统一流程：退出申请提交→阿里生态负责人审核 → 同步财务部，标准化保证金、未结货款双向核对 → 分销商提交收据→启动结算申请 → 财务打款，完成合作注销 → 订货系统、分销客户档案同步标记关闭 → 全渠道通知其他分销商，预防串货及渠道冲突。"}]}], "kpiWeights": "品牌达成20%，渠道回款达成35%，渠道利润达成35%，工作表现10%"}], "内容种草": [{"na ief进行脚本撰写和视频拍摄制作  ←  7. Brief输出与沟通：向达人输出产品Brief和内容方向要求  ←  6. 签署合作协议：推动合作协议签署，明确权益和义务  ←  5. 确定合作方案：确认达人合作机制（佣金/服务费/产品置换等）\n                              ↓                              \n9. 内容审核把关：内部审核达人提交的脚本和成片质量  →  10. 修改优化：与达人沟通修改意见，确保内容符合品牌要求  →  11. 内容发布上架：达人按规定时间发布内容  →  12. 结束 | [image6.png]\n媒介投放岗 / 内容策划岗 | 1.3.1.3 | 种草跟踪与投流（天猫渠道） | 【流程说明】发布后投流投放：效果监测→投流优化→数据复盘→总结归档\n\n1. 内容发布确认：确认达人内容已按约定时间和形式发布  →  2. 投流计划启动：根据预设KPI和预算启动内容投流  →  3. 实时数据监控：监控曝光量/点击量/互动量/转化率等核心指标  →  4. 投流效果评估：评估投流ROI、新客成本、费销比指标\n                              ↓                              \n8. 效果复盘总结：复盘内容投流效果，总结有效模式和失败经验  ←  7. 数据汇总统计：汇总统计种草内容发布和投流消耗数据  ←  6. 投流优化调整：针对低效计划调整定向/出价/素材进行优化  ←  5. 低效计划识别：识别低于预期效果的投流计划，标记待优化\n                              ↓                              \n9. 优质内容放大：对优质内容加大投流力度放大效果  →  10. 数据归档保存：将发布数据和投流数据归档保存至知识库  →  11. 结束 | [image6.png]\n内容策划岗 / 媒介投放岗 | 2.3.2.3 | 种草规划与达人对接（自播渠道） | 【流程说明】自播渠道种草粉丝达人排查确认，跟进寄样与发布排期\n\n1. 年度种草规划：年初根据年度目标制定全年种草规划和预算  →  2. 月度达人规划：当月月底前制定次月达人合作规划和内容方向  →  3. 达人筛选确认：用《达人筛选表》按各维度筛选潜在合作达人  →  4. 达人沟通建联：通过巨量星图/同行推荐等方式与达人建联\n                              ↓                              \n8. 签订合作协议：推动合作协议签约流程  ←  7. 内容方向沟通：与达人沟通确认推广内容方向和创意要求  ←  6. 寄样确认排期：对有合作意向达人安排产品寄样确认排期  ←  5. 合作意向确认：确认达人合作意向与合作模式（挂车/混播/专场）\n                              ↓                              \n9. 排期确认入库：将确认合作排期录入《达播排期表》  →  10. 结束 | [image20.png]\n媒介投放岗 / 内容策划岗 | 2.3.2.4 | 种草活动发起（自播渠道） | 【流程说明】自播渠道KOL/KOC达人合作执行全过程：寄样→内容审核→发布→数据追踪\n\n1. 达人合作确认：确认达人合作机制和发布排期  →  2. 寄样安排：按合作要求安排产品寄样和物流跟踪  →  3. Brief输出：向达人输出详细产品Brief和内容要求  →  4. 达人脚本创作：达人根据Brief创作脚本和内容方案\n                              ↓                              \n8. 成片质量审核：审核达人最终成片，把控视觉质量和产品展示  ←  7. 达人视频制作：达人按审核通过的脚本进行视频拍摄和制作  ←  6. 修改优化沟通：与达人沟通修改意见，确保内容方向正确  ←  5. 脚本内容审核：审核达人脚本大纲，确认产品卖点表述准确\n                              ↓                              \n9. 平台合规审核：确认视频内容符合平台审核规则  →  10. 达人发布内容：达人按规定时间在平台发布种草内容  →  11. 发布后效果监测：监测发布后的曝光量/互动量/引流数据  →  12. 投流加推：对优质内容投放抖加/种草通加推放量\n                              ↓ 播方案", "workStandards": "品牌宣传 | PP-SOP-1 | 品牌年度战略规划制定 | 【流程说明】制定年度品牌宣传整体战略、定位及传播规划，明确品牌核心价值和调性\n\n1. 行业趋势研究：追踪化妆品行业趋势、市场规模、竞争格局  →  2. 品牌定位梳理：确定品牌在目标消费者心智中的独特位置，明确差异化优势  →  3. 用户洞察分析：通过调研访谈数据分析理解目标消费者画像需求痛点  →  4. 品牌故事提炼：提炼品牌核心价值观，打造品牌故事和文化内涵\n                              ↓                              \n8. KPI体系搭建：设定品牌宣传活动KPI指标（声量/美誉度/转化率等）  ←  7. 传播渠道规划：构建品牌内容矩阵，规划不同平台的差异化定位和内容分工  ←  6. 年度预算编制：制定年度品牌宣传预算，合理分配至各项目和渠道  ←  5. 年度目标确定：制定品牌未来1-3年发展目标、市场策略和路线图\n                              ↓                              \n9. 部门协同对齐：与产品/销售/渠道部门对齐年度策略和协作机制  →  10. 方案评审报批：提交品牌年度战略规划方案至管理层评审报批  →  11. 季度复盘优化：每季度复盘战略执行情况并适时调整优化  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 / 推广传播 | PP-SOP-2 | 品牌整合营销传播执行 | 【流程说明】品牌大型整合营销活动的全方位传播执行链：从策划到复盘\n\n1. 传播目标确定：基于品牌传播策略明确本次传播活动的核心目标  →  2. 受众分析与洞察：分析目标受众的媒介触点和内容偏好  →  3. 媒介策略制定：制定线上线下广告策略，确定核心传播渠道和预算分配  →  4. 内容策划产出：规划高质量内容产出（品牌故事/短视频/图文/KOL合作内容）\n                              ↓                              \n8. 实时数据监控：活动期间24小时监控传播数据（曝光/互动/转化）  ←  7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流程说明】品牌38/618/双11及重点品牌项目活动的全流程管理\n\n1. 市场调研启动：活动前2个月完成市场用户调研，确定活动方向和主题  →  2. 方向方案确认：节点前6周完成活动创意玩法确认，与各部门沟通  →  3. 策划方案输出：节点前1个月完成活动策划方案，确定指标并同步各渠道  →  4. 项目团队组建：组建活动项目团队，明确各成员职责和任务分工\n                              ↓                              \n8. 活动正式执行：按项目推进表执行活动，实时监控进度和质量  ←  7. 活动预热推广：按计划启动活动预热宣传和媒体推广  ←  6. 物料设计制作：对接设计团队完成活动所需视觉物料设计制作  ←  5. 供应商资源确认：确认活动涉及的外部供应商和合作资源\n                              ↓                              \n9. 过程风险管理：识别和应对活动执行过程中的各类风险因素  →  10. 活动效果监测：实时监测活动数据指标和用户参与度  →  11. 活动复盘总结：活动结束一周内完成项目复盘和效果分析  →  12. 经验归档沉淀：将活动经验和方法论归档至知识库\n                              ↓                              \n13. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌内容 | PP-SOP-6 | 品牌自媒体内容策划与运营 | 【流程说明】品牌微信公众号/视频号的标准化内容策划、制作和发布流程\n\n1. 年度内容规划：年初制定品牌自媒体官号年度内容规划和发布日历  →  2. 月度选题策划：每月初根据年度规划确定当月选题方向和主题  →  3. 内容素材收集：收集整理内容创作所需的产品信息、图片、数据素材  →  4. 文案撰写与设计：撰写公众号推文/视频脚本，同步输出设计需求（发布前1周）\n                              ↓                              \n8. 后台粉丝互动：发布48小时内处理后台粉丝评论和私信互动  ←  7. 发布后数据监控：发布48小时内监控阅读量/互动量/涨粉数据  ←  6. 排版发布上线：按排期在公众号/视频号完成内容排版和发布  ←  5. 稿件审核校对：内容审核（品牌调性/信息准确性/合规性）和多轮校对\n                              ↓                              \n9. 月度效果复盘：月末分析内容表现数据，优化选题和创作方向  →  10. 竞品内容分析：定期分析竞品品牌自媒体内容策略和爆款模式  →  11. 年度内容升级：根据品牌发展和用户反馈进行年度内容升级  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n推广传播 | PP-SOP-7 | 微博品牌传播与粉丝运营 | 【流程说明】立足微博平台的品牌传播、粉丝运营和整合传 品牌形象", "jobRequirements": "本科及以上学历，2年以上公关/媒体关系经验；具备危机公关处理能力和优秀的文案写作能力；有媒体资源优先", "workProcess": "1 | 品牌宣传 | 每日 | 1. 品牌舆情监控：查看全网品牌舆情日报，及时处理负面信息。2. 品宣团队晨会：主持品宣团队晨会，跟进各项工作进度。3. 传播效果监控：查看当日各平台品牌传播内容数据和用户反馈。4. 媒体关系维护：与核心媒体保持日常沟通，维护媒体关系\n2 | 每周 | 1. 传播内容复盘：复盘上周各渠道品牌传播内容效果。2. 团队周会：组织品宣团队周会，拆解下周任务。3. 策略调整：根据数据表现和热点调整传播策略。4. 竞品监测：分析竞品品牌传播动态和策略变化\n3 | 每月 | 1. 月度经营分析：输出品牌宣传月度经营报告。2. 季度策略制定：制定下季度品牌宣传策略和传播规划。3. 预算管控：审核月度费用使用情况，调整下月预算分配。4. VI规范检查：全面检查各渠道品牌视觉统一性\n4 | 品牌公关 | 每日 | 1. 舆情监控：全网舆情监控日报，及时发现和跟踪负面信息。2. 媒体沟通：与核心媒体记者保持日常沟通和信息交换。3. 公关稿件撰写：根据传播需求撰写新闻稿和公关稿件\n5 | 每周 | 1. 公关稿件发布：每周完成公关PR稿件发布（平均每月6-8篇）。2. 媒体资源拓展：拓展新的媒体合作资源和记者关系。3. 舆情周报：汇总本周舆情监控数据和重点事件\n6 | 每月 | 1. 月度舆情报告：输出月度品牌舆情分析报告。2. 媒体关系盘点：盘点媒体关系和资源覆盖情况。3. 危机预案更新：更新品牌危机公关应对预案\n7 | 品牌活动 | 每日 | 1. 活动进度跟踪：跟进进行中的品牌活动执行进度。2. 物料确认：确认活动物料制作和到货情况。3. 跨部门沟通：与设计/采购/场地方等协调活动执行细节\n8 | 每周 | 1. 活动策划推进：推进下阶段品牌活动策划方案。2. 供应商管理：跟进活动供应商合作进度。3. 预算核对：核对活动费用支出和预算执行情况\n9 | 每月 | 1. 活动复盘报告：输出月度品牌活动复盘报告。2. 下月活动规划：制定下月品牌活动日历和执行方案。3. 市场调研：完成活动相关的市场用户调研\n10 | 品牌内容 | 每日 | 1. 内容审核：审核各渠道品牌宣传内容，确保信息一致性。2. 素材收集：收集整理品牌传播所需文字和图片素材。3. 官号维护：查看微信公众号/视频号后台数据，处理粉丝互动\n11 | 每周 | 1. 官号更新：微信公众号/视频号月度更新1-2篇，提交设计需求。2. 内容复盘：复盘上周内容传播效果（阅读量/互动量/涨粉）。3. PPT更新：每周检查更新品牌PPT内容\n12 | 每月 | 1. 月度内容规划：规划品牌自媒体下月内容日历。2. 品牌手册优化：根据品牌发展和需求优化品牌手册内容。3. 竞品内容分析：分析竞品品牌内容策略和表达方式\n13 | 品牌物料 | 每日 | 1. 物料需求处理：登记和处理各渠道物料需求。2. 订单跟进：跟踪已下单物料的制作进度。3. 库存核对：核对物料库存，预警库存不足物料\n14 | 每周 | 1. 物料库存盘点：每周统计物料库存使用情况。2. 供应商沟通：与物料供应商沟通制作进度和需求。3. 需求汇总：汇总各渠道本周物料需求和下周计划\n15 | 每月 | 1. 物料费用核算：核算月度物料费用支出。2. 供应商评估：评估供应商合作效果和性价比。3. 库存盘点报告：输出月度物料库存盘点报告\n16 | 推广传播 | 每日 | 1. 微博运营：博文周更3-4次，处理私域互动。2. 传播数据监控：监控各平台品牌传播数据表现。3. 媒介沟通：与各平台媒介资源保持沟通\n17 | 每周 | 1. 微博规划：每周完成1次微博内容规划，提交设计需求1次。2. 资源对接：提前联系小红书/抖音/B站等媒介确定核心玩法。3. 传播复盘：复盘本周整合传播活动效果\n18 | 每月 | 1. 月度传播报告：输出月度品牌传播效果报告。2. 媒介资源盘点：盘点和更新各平台媒介资源库。3. 下月传播规划：制定下月品牌整合传播方案", "workStandards": "品牌宣传 | PP-SOP-1 | 品牌年度战略规划制定 | 【流程说明】制定年度品牌宣传整体战略、定位及传播规划，明确品牌核心价值和调性\n\n1. 行业趋势研究：追踪化妆品行业趋势、市场规模、竞争格局  →  2. 品牌定位梳理：确定品牌在目标消费者心智中的独特位置，明确差异化优势  →  3. 用户洞察分析：通过调研访谈数据分析理解目标消费者画像需求痛点  →  4. 品牌故事提炼：提炼品牌核心价值观，打造品牌故事和文化内涵\n                              ↓                              \n8. KPI体系搭建：设定品牌宣传活动KPI指标（声量/美誉度/转化率等）  ←  7. 传播渠道规划：构建品牌内容矩阵，规划不同平台的差异化定位和内容分工  ←  6. 年度预算编制：制定年度品牌宣传预算，合理分配至各项目和渠道  ←  5. 年度目标确定：制定品牌未来1-3年发展目标、市场策略和路线图\n                              ↓                              \n9. 部门协同对齐：与产品/销售/渠道部门对齐年度策略和协作机制  →  10. 方案评审报批：提交品牌年度战略规划方案至管理层评审报批  →  11. 季度复盘优化：每季度复盘战略执行情况并适时调整优化  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 / 推广传播 | PP-SOP-2 | 品牌整合营销传播执行 | 【流程说明】品牌大型整合营销活动的全方位传播执行链：从策划到复盘\n\n1. 传播目标确定：基于品牌传播策略明确本次传播活动的核心目标  →  2. 受众分析与洞察：分析目标受众的媒介触点和内容偏好  →  3. 媒介策略制定：制定线上线下广告策略，确定核心传播渠道和预算分配  →  4. 内容策划产出：规划高质量内容产出（品牌故事/短视频/图文/KOL合作内容）\n                              ↓                              \n8. 实时数据监控：活动期间24小时监控传播数据（曝光/互动/转化）  ←  7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流程说明】品牌38/618/双11及重点品牌项目活动的全流程管理\n\n1. 市场调研启动：活动前2个月完成市场用户调研，确定活动方向和主题  →  2. 方向方案确认：节点前6周完成活动创意玩法确认，与各部门沟通  →  3. 策划方案输出：节点前1个月完成活动策划方案，确定指标并同步各渠道  →  4. 项目团队组建：组建活动项目团队，明确各成员职责和任务分工\n                              ↓                              \n8. 活动正式执行：按项目推进表执行活动，实时监控进度和质量  ←  7. 活动预热推广：按计划启动活动预热宣传和媒体推广  ←  6. 物料设计制作：对接设计团队完成活动所需视觉物料设计制作  ←  5. 供应商资源确认：确认活动涉及的外部供应商和合作资源\n                              ↓                              \n9. 过程风险管理：识别和应对活动执行过程中的各类风险因素  →  10. 活动效果监测：实时监测活动数据指标和用户参与度  →  11. 活动复盘总结：活动结束一周内完成项目复盘和效果分析  →  12. 经验归档沉淀：将活动经验和方法论归档至知识库\n                              ↓                              \n13. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌内容 | PP-SOP-6 | 品牌自媒体内容策划与运营 | 【流程说明】品牌微信公众号/视频号的标准化内容策划、制作和发布流程\n\n1. 年度内容规划：年初制定品牌自媒体官号年度内容规划和发布日历  →  2. 月度选题策划：每月初根据年度规划确定当月选题方向和主题  →  3. 内容素材收集：收集整理内容创作所需的产品信息、图片、数据素材  →  4. 文案撰写与设计：撰写公众号推文/视频脚本，同步输出设计需求（发布前1周）\n                              ↓                              \n8. 后台粉丝互动：发布48小时内处理后台粉丝评论和私信互动  ←  7. 发布后数据监控：发布48小时内监控阅读量/互动量/涨粉数据  ←  6. 排版发布上线：按排期在公众号/视频号完成内容排版和发布  ←  5. 稿件审核校对：内容审核（品牌调性/信息准确性/合规性）和多轮校对\n                              ↓                              \n9. 月度效果复盘：月末分析内容表现数据，优化选题和创作方向  →  10. 竞品内容分析：定期分析竞品品牌自媒体内容策略和爆款模式  →  11. 年度内容升级：根据品牌发展和用户反馈进行年度内容升级  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n推广传播 | PP-SOP-7 | 微博品牌传播与粉丝运营 | 【流程说明】立足微博平台的品牌传播、粉丝运营和整合传播活动落地流程\n\n1. 微博账号定位：明确品牌微博账号的定位、人设和内容调性  →  2. 周度内容规划：每周完成1次微博博文内容规划（周更3-4次）  →  3. 设计需求提交：每周提交1次微博视觉设计需求（配图/海报）  →  4. 博文撰写编辑：根据内容规划撰写博文文案并编辑发布\n                              ↓                              \n8. 活动方案策划：重点传播活动提前 发展目标、市场策略和路线图\n                              ↓                              \n9. 部门协同对齐：与产品/销售/渠道部门对齐年度策略和协作机制  →  10. 方案评审报批：提交品牌年度战略规划方案至管理层评审报批  →  11. 季度复盘优化：每季度复盘战略执行情况并适时调整优化  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 / 推广传播 | PP-SOP-2 | 品牌整合营销传播执行 | 【流程说明】品牌大型整合营销活动的全方位传播执行链：从策划到复盘\n\n1. 传播目标确定：基于品牌传播策略明确本次传播活动的核心目标  →  2. 受众分析与洞察：分析目标受众的媒介触点和内容偏好  →  3. 媒介策略制定：制定线上线下广告策略，确定核心传播渠道和预算分配  →  4. 内容策划产出：规划高质量内容产出（品牌故事/短视频/图文/KOL合作内容）\n                              ↓                              \n8. 实时数据监控：活动期间24小时监控传播数据（曝光/互动/转化）  ←  7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流程说明】品牌38/618/双11及重点品牌项目活动的全流程管理\n\n1. 市场调研启动：活动前2个月完成市场用户调研，确定活动方向和主题  →  2. 方向方案确认：节点前6周完成活动创意玩法确认，与各部门沟通  →  3. 策划方案输出：节点前1个月完成活动策划方案，确定指标并同步各渠道  →  4. 项目团队组建：组建活动项目团队，明确各成员职责和任务分工\n                              ↓                              \n8. 活动正式执行：按项目推进表执行活动，实时监控进度和质量  ←  7. 活动预热推广：按计划启动活动预热宣传和媒体推广  ←  6. 物料设计制作：对接设计团队完成活动所需视觉物料设计制作  ←  5. 供应商资源确认：确认活动涉及的外部供应商和合作资源\n                              ↓                              \n9. 过程风险管理：识别和应对活动执行过程中的各类风险因素  →  10. 活动效果监测：实时监测活动数据指标和用户参与度  →  11. 活动复盘总结：活动结束一周内完成项目复盘和效果分析  →  12. 经验归档沉淀：将活动经验和方法论归档至知识库\n                              ↓                              \n13. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌内容 | PP-SOP-6 | 品牌自媒体内容策划与运营 | 【流程说明】品牌微信公众号/视频号的标准化内容策划、制作和发布流程\n\n1. 年度内容规划：年初制定品牌自媒体官号年度内容规划和发布日历  →  2. 月度选题策划：每月初根据年度规划确定当月选题方向和主题  →  3. 内容素材收集：收集整理内容创作所需的产品信息、图片、数据素材  →  4. 文案撰写与设计：撰写公众号推文/视频脚本，同步输出设计需求（发布前1周）\n                              ↓                              \n8. 后台粉丝互动：发布48小时内处理后台粉丝评论和私信互动  ←  7. 发布后数据监控：发布48小时内监控阅读量/互动量/涨粉数据  ←  6. 排版发布上线：按排期在公众号/视频号完成内容排版和发布  ←  5. 稿件审核校对：内容审核（品牌调性/信息准确性/合规性）和多轮校对\n                              ↓                              \n9. 月度效果复盘：月末分析内容表现数据，优化选题和创作方向  →  10. 竞品内容分析：定期分析竞品品牌自媒体内容策略和爆款模式  →  11. 年度内容升级：根据品牌发展和用户反馈进行年度内容升级  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n推广传播 | PP-SOP-7 | 微博品牌传播与粉丝运营 | 【流程说明】立足微博平台的品牌传播、粉丝运营和整合传播活动落地流程\n\n1. 微博账号定位：明确品牌微博账号的定位、人设和内容调性  →  2. 周度内容规划：每周完成1次微博博文内容规划（周更3-4次）  →  3. 设计需求提交：每周提交1次微博视觉设计需求（配图/海报）  →  4. 博文撰写编辑：根据内容规划撰写博文文案并编辑发布\n                              ↓                              \n8. 活动方案策划：重点传播活动提前1个月制定微博端传播方案  ←  7. 抽奖活动策划：策划和执行微博抽奖/挑战赛/征集活动  ←  6. 热点话题借势：跟进节日/节点/热点策划借势传播内容  ←  5. 粉丝互动维护：日常进行粉丝评论回复、私信回复（每周400次互动）\n                              ↓                              \n9. 跨平台联动：联动小红书/抖音/B站等渠道落实整合传播  →  1 战略执行情况并适时调整优化  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 / 推广传播 | PP-SOP-2 | 品牌整合营销传播执行 | 【流程说明】品牌大型整合营销活动的全方位传播执行链：从策划到复盘\n\n1. 传播目标确定：基于品牌传播策略明确本次传播活动的核心目标  →  2. 受众分析与洞察：分析目标受众的媒介触点和内容偏好  →  3. 媒介策略制定：制定线上线下广告策略，确定核心传播渠道和预算分配  →  4. 内容策划产出：规划高质量内容产出（品牌故事/短视频/图文/KOL合作内容）\n                              ↓                              \n8. 实时数据监控：活动期间24小时监控传播数据（曝光/互动/转化）  ←  7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流 . 受众分析与洞察：分析目标受众的媒介触点和内容偏好  →  3. 媒介策略制定：制定线上线下广告策略，确定核心传播渠道和预算分配  →  4. 内容策划产出：规划高质量内容产出（品牌故事/短视频/图文/KOL合作内容）\n                              ↓                              \n8. 实时数据监控：活动期间24小时监控传播数据（曝光/互动/转化）  ←  7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流程说明】品牌38/618/双11及重点品牌项目活动的全流程管理\n\n1. 市场调研启动：活动前2个月完成市场用户调研，确定活动方向和主题  →  2. 方向方案确认：节点前6周完成活动创意玩法确认，与各部门沟通  →  3. 策划方案输出：节点前1个月完成活动策划方案，确定指标并同步各渠道  →  4. 项目团队组建：组建活动项目团队，明确各成员职责和任务分工\n                              ↓                              \n8. 活动正式执行：按项目推进表执行活动，实时监控进度和质量  ←  7. 活动预热推广：按计划启动活动预热宣传和媒体推广  ←  6. 物料设计制作：对接设计团队完成活动所需视觉物料设计制作  ←  5. 供应商资源确认：确认活动涉及的外部供应商和合作资源\n                              ↓                              \n9. 过程风险管理：识别和应对活动执行过程中的各类风险因素  →  10. 活动效果监测：实时监测活动数据指标和用户参与度  →  11. 活动复盘总结：活动结束一周内完成项目复盘和效果分析  →  12. 经验归档沉淀：将活动经验和方法论归档至知识库\n                              ↓                              \n13. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌内容 | PP-SOP-6 | 品牌自媒体内容策划与运营 | 【流程说明】品牌微信公众号/视频号的标准化内容策划、制作和发布流程\n\n1. 年度内容规划：年初制定品牌自媒体官号年度内容规划和发布日历  →  2. 月度选题策划：每月初根据年度规划确定当月选题方向和主题  →  3. 内容素材收集：收集整理内容创作所需的产品信息、图片、数据素材  →  4. 文案撰写与设计：撰写公众号推文/视频脚本，同步输出设计需求（发布前1周）\n                              ↓                              \n8. 后台粉丝互动：发布48小时内处理后台粉丝评论和私信互动  ←  7. 发布后数据监控：发布48小时内监控阅读量/互动量/涨粉数据  ←  6. 排版发布上线：按排期在公众号/视频号完成内容排版和发布  ←  5. 稿件审核校对：内容审核（品牌调性/信息准确性/合规性）和多轮校对\n                              ↓                              \n9. 月度效果复盘：月末分析内容表现数据，优化选题和创作方向  →  10. 竞品内容分析：定期分析竞品品牌自媒体内容策略和爆款模式  →  11. 年度内容升级：根据品牌发展和用户反馈进行年度内容升级  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n推广传播 | PP-SOP-7 | 微博品牌传播与粉丝运营 | 【流程说明】立足微博平台的品牌传播、粉丝运营和整合传播活动落地流程\n\n1. 微博账号定位：明确品牌微博账号的定位、人设和内容调性  →  2. 周度内容规划：每周完成1次微博博文内容规划（周更3-4次）  →  3. 设计需求提交：每周提交1次微博视觉设计需求（配图/海报）  →  4. 博文撰写编辑：根据内容规划撰写博文文案并编辑发布\n                              ↓                              \n8. 活动方案策划：重点传播活动提前1个月制定微博端传播方案  ←  7. 抽奖活动策划：策划和执行微博抽奖/挑战赛/征集活动  ←  6. 热点话题借势：跟进节日/节点/热点策划借势传播内容  ←  5. 粉丝互动维护：日常进行粉丝评论回复、私信回复（每周400次互动）\n                              ↓                              \n9. 跨平台联动：联动小红书/抖音/B站等渠道落实整合传播  →  10. 舆情监控处理：微博平台品牌舆情监控和客服回复、负面处理  →  11. 月度传播报告：输出月度微博传播数据报告和涨粉情况  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）", "kpiStandards": "品牌宣传 | 品牌声量指数 | ≥年度目标 | 每月 | 品牌在全渠道的搜索量/讨论量综合指数\n品牌美誉度 | ≥85分 | 每季 | 品牌正面评价占比和用户满意度调查得分\n品牌传播触达人次 | ≥季度目标 | 每月 | 全渠道品牌传播内容总触达用户人次\n传播预算执行率 | 95%-105% | 每月 | 实际传播费用/预算传播费用\nVI视觉统一率 | ≥95% | 每月 | 对外视觉输出符合VI规范的比例\ 7. 各渠道同步上线：在规划时间节点同步上线各渠道传播内容  ←  6. 物料与设计准备：对接设计团队完成传播物料制作（海报/视频/文案）  ←  5. KOL/媒体合作洽谈：筛选与品牌调性相符的KOL和媒体合作资源签约\n                              ↓                              \n9. 应急调整优化：根据数据表现和用户反馈实时调整传播策略  →  10. 活动效果复盘：活动结束后一周内完成效果复盘和数据分析  →  11. 结案报告归档：撰写结案报告，归档传播数据和经验总结  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌宣传 | PP-SOP-3 | 品牌VI规范管理与视觉审核 | 【流程说明】确保所有对外输出的视觉形象符合品牌VI规范的标准管理流程\n\n1. VI规范制定：根据品牌定位和发展阶段制定优化品牌VI视觉输出规范  →  2. 规范文档发布：编制发布品牌VI视觉应用规范手册（Logo/配色/字体/排版）  →  3. 设计需求对接：接收各渠道品牌视觉设计需求（广告/包装/物料/数字）  →  4. 设计稿件审核：根据VI规范审核各渠道设计稿件，确保视觉统一性\n                              ↓                              \n8. 供应商VI培训：对新供应商进行品牌VI规范培训  ←  7. 对外发布监控：监控所有对外发布的视觉内容是否符合规范  ←  6. 最终稿件确认：确认修改后的设计稿件符合品牌VI规范  ←  5. 修改意见反馈：24小时内给出修改反馈意见，与设计师沟通调整\n                              ↓                              \n9. 定期规范更新：根据品牌发展阶段定期评估和更新VI规范  →  10. 归档管理：所有审核通过的VI文件和相关资料归档保存  →  11. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌公关 | PP-SOP-4 | 品牌危机公关应急预案 | 【流程说明】品牌负面舆情出现时的标准化应对和处理流程\n\n1. 舆情监测发现：通过舆情监控系统/媒体/社交平台发现品牌负面信息  →  2. 危机等级判定：根据影响范围(单平台/多平台/全网)和严重程度判定危机等级  →  3. 应急小组成立：启动危机公关应急预案，成立跨部门应急处理小组  →  4. 事实核查与信息收集：快速核查负面信息的事实真相，收集核实证据材料\n                              ↓                              \n8. 负面内容处理：对明显不实信息采取投诉/举报/法律等手段处理  ←  7. 媒体沟通与引导：与核心媒体沟通真实情况，争取正向报道  ←  6. 官方声明发布：通过品牌官方渠道发布正式声明或回应  ←  5. 统一口径制定：法务/品牌/公关联合制定对外统一回应口径\n                              ↓                              \n9. 后续跟进监测：危机处理后持续监测舆情变化和公众反应  →  10. 危机复盘总结：危机处理结束后输出危机公关复盘报告  →  11. 预案迭代优化：根据本次危机处理经验优化更新危机公关应急流程  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌活动 | PP-SOP-5 | 品牌年度重点活动策划与执行 | 【流程说明】品牌38/618/双11及重点品牌项目活动的全流程管理\n\n1. 市场调研启动：活动前2个月完成市场用户调研，确定活动方向和主题  →  2. 方向方案确认：节点前6周完成活动创意玩法确认，与各部门沟通  →  3. 策划方案输出：节点前1个月完成活动策划方案，确定指标并同步各渠道  →  4. 项目团队组建：组建活动项目团队，明确各成员职责和任务分工\n                              ↓                              \n8. 活动正式执行：按项目推进表执行活动，实时监控进度和质量  ←  7. 活动预热推广：按计划启动活动预热宣传和媒体推广  ←  6. 物料设计制作：对接设计团队完成活动所需视觉物料设计制作  ←  5. 供应商资源确认：确认活动涉及的外部供应商和合作资源\n                              ↓                              \n9. 过程风险管理：识别和应对活动执行过程中的各类风险因素  →  10. 活动效果监测：实时监测活动数据指标和用户参与度  →  11. 活动复盘总结：活动结束一周内完成项目复盘和效果分析  →  12. 经验归档沉淀：将活动经验和方法论归档至知识库\n                              ↓                              \n13. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n品牌内容 | PP-SOP-6 | 品牌自媒体内容策划与运营 | 【流程说明】品牌微信公众号/视频号的标准化内容策划、制作和发布流程\n\n1. 年度内容规划：年初制定品牌自媒体官号年度内容规划和发布日历  →  2. 月度选题策划：每月初根据年度规划确定当月选题方向和主题  →  3. 内容素材收集：收集整理内容创作所需的产品信息、图片、数据素材  →  4. 文案撰写与设计：撰写公众号推文/视频脚本，同步输出设计需求（发布前1周）\n                              ↓                              \n8. 后台粉丝互动：发布48小时内处理后台粉丝评论和私信互动  ←  7. 发布后数据监控：发布48小时内监控阅读量/互动量/涨粉数据  ←  6. 排版发布上线：按排期在公众号/视频号完成内容排版和发布  ←  5. 稿件审核校对：内容审核（品牌调性/信息准确性/合规性）和多轮校对\n                              ↓                              \n9. 月度效果复盘：月末分析内容表现数据，优化选题和创作方向  →  10. 竞品内容分析：定期分析竞品品牌自媒体内容策略和爆款模式  →  11. 年度内容升级：根据品牌发展和用户反馈进行年度内容升级  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）\n推广传播 | PP-SOP-7 | 微博品牌传播与粉丝运营 | 【流程说明】立足微博平台的品牌传播、粉丝运营和整合传播活动落地流程\n\n1. 微博账号定位：明确品牌微博账号的定位、人设和内容调性  →  2. 周度内容规划：每周完成1次微博博文内容规划（周更3-4次）  →  3. 设计需求提交：每周提交1次微博视觉设计需求（配图/海报）  →  4. 博文撰写编辑：根据内容规划撰写博文文案并编辑发布\n                              ↓                              \n8. 活动方案策划：重点传播活动提前1个月制定微博端传播方案  ←  7. 抽奖活动策划：策划和执行微博抽奖/挑战赛/征集活动  ←  6. 热点话题借势：跟进节日/节点/热点策划借势传播内容  ←  5. 粉丝互动维护：日常进行粉丝评论回复、私信回复（每周400次互动）\n                              ↓                              \n9. 跨平台联动：联动小红书/抖音/B站等渠道落实整合传播  →  10. 舆情监控处理：微博平台品牌舆情监控和客服回复、负面处理  →  11. 月度传播报告：输出月度微博传播数据报告和涨粉情况  →  12. 结束 | （来自标准化推进-品宣主管/品牌活动/品牌内容/推广传播 SOP 标准化梳理）", "kpiStandards": "品牌宣传 | 品牌声量指数 | ≥年度目标 | 每月 | 品牌在全渠道的搜索量/讨论量综合指数\n品牌美誉度 | ≥85分 | 每季 | 品牌正面评价占比和用户满意度调查得分\n品牌传播触达人次 | ≥季度目标 | 每月 | 全渠道品牌传播内容总触达用户人次\n传播预算执行率 | 95%-105% | 每月 | 实际传播费用/预算传播费用\nVI视觉统一率 | ≥95% | 每月 | 对外视觉输出符合VI规范的比例\n团队KPI达成率 | ≥90% | 每月 | 团队成员KPI平均达成率\n品牌公关 | 媒体稿件发布量 | 6-8篇/月 | 每月 | 每月发布的品牌PR公关稿件数量\n媒体正面报道率 | ≥80% | 每月 | 品牌相关报道中正面/中性报道的比例\n舆情响应速度 | ≤2小时 | 实时 | 负面舆情从发现到响应的平均时间\n危机事件解决率 | 100% | 按事件 | 品牌危机事件的妥善解决率\n品牌活动 | 活动到场/ . 设计复盘：复盘上周品牌视觉设计效果。4. VI规范优化：收集VI应用中的问题提出优化建议\n9 | 品牌设计师 | 每月 | 1. 公众号视觉：完成公众号月度1-2篇视觉设计。2. 品牌手册更新：根据品牌发展更新品牌手册设计。3. 展会物料：提前完成品牌展会所需视觉设计。4. 设计规范迭代：提交VI规范优化方案\n10 | AI设计师 | 每日 | 1. AI素材生成：运用AI工具生成设计所需的图文素材。2. AI视频处理：进行AI视频剪辑和后期特效制作。3. 工具研究：测试和试用最新的AI设计工具。4. 素材库维护：整理和归档AI生成的优质素材\n11 | AI设计师 | 每周 | 1. 效率提升报告：输出AI工具使用效率提升数据。2. 工具分享：向团队分享AI设计工具的使用技巧。3. 效果优化：优化AI提示词和工作流提升生成质量\n12 | AI设计师 | 每月 | 1. AI工具评估报告：输出月度AI设计工具评估和应用报告。2. 培训推广：组织AI设计工具培训推广。3. 趋势研究：跟踪AI设计领域最新发展\n13 | 产品策划 | 每日 | 1. 竞品详情页分析：跟进竞品店铺详情页，随看随记形成思维导图。2. 产品内容优化：优化产品详情页内容，提供对消费者有价值的内容。3. 运营需求响应：积极与运营沟通配合输出产品内容。4. 违禁词排查：日常排查页面违禁词\n14 | 产品策划 | 每周 | 1. 违禁词排查：每周排查页面违禁词，重大活动提前2周排查。2. 产品内容更新：根据新品上市计划更新产品详情页内容。3. 竞品分析更新：更新竞品内容分析思维导图。4. 渠道内容支持：输出直播大字报、种草BF等内容\n15 | 产品策划 | 每月 | 1. 新品内容准备：新品至少提前2个月准备相关内容并多方沟通确认。2. 内容规范更新：更新产品内容表达规范和标准。3. 合规检查报告：输出月度产品内容合规检查报告\n16 | 品牌内容策划 | 每日 | 1. 创意策划：策划品牌视频创意方案，输出视频脚本。2. 素材收集：收集视频制作所需参考素材和灵感。3. 项目跟进：跟进进行中的视频项目制作进度\n17 | 品牌内容策划 | 每周 | 1. 视频脚本撰写：根据品牌传播需求撰写视频脚本。2. 拍摄协调：与拍摄团队协调视频拍摄安排。3. 创意复盘：复盘已发布视频的传播效果，优化创意方向。4. 趋势追踪：收集分析品牌视频创意趋势\n18 | 品牌内容策划 | 每月 | 1. 月度视频规划：规划下月品牌视频内容选题和制作计划。2. 创意案例库更新：更新品牌视频创意案例库。3. 效果分析：分析月度视频内容传播效果\n19 | 摄像岗 | 每日 | 1. 拍摄执行：按排期完成当日视频拍摄任务。2. 设备检查：检查摄像机、灯光、收音设备状态。3. 素材导入：将拍摄素材导入电脑并备份。4. 现场清洁：清理拍摄场地和设备\n20 | 摄像岗 | 每周 | 1. 素材整理：按项目对拍摄素材分类命名归档。2. 设备保养：深度清洁和维护拍摄设备。3. 拍摄复盘：复盘拍素材质与剪辑团队沟通优化\n21 | 摄像岗 | 每月 | 1. 月度拍摄统计：统计月度拍摄视频数量和类型。2. 设备检修：对拍摄设备进行全面检修。3. 技能提升：学习新的拍摄技法和布光技巧\n22 | 摄影岗 | 每日 | 1. 产品拍摄：按排期完成当日产品静物拍摄。2. 图片处理：对拍摄照片进行后期调色修图处理。3. 素材归档：完成当日拍摄照片的分类归档\n23 | 摄影岗 | 每周 | 1. 拍摄方案设计：根据下周需求设计拍摄方案和场景。2. 设备保养：维护摄影器材和灯光设备。3. 素材整理：整理归档本周拍摄素材\n24 | 摄影岗 | 每月 | 1. 产品图片库更新：更新维护产品图片库。2. 拍摄质量复盘：复盘月度拍摄质量并进行优化。3. 设备维护：摄影器材深度维护", "workStandards": "视觉负责人 / 渠道设计师 | DS-SOP-1 | 电商大促全渠道视觉设计执行 | 【流程说明】涵盖天猫/京东/拼多多/抖音全渠道大促视觉方案的标准化执行流程\n\n1. 活动方案对接：接收运营端大促活动方案，明确活动主题、核心利益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视 | 每日 | 1. 产品拍摄：按排期完成当日产品静物拍摄。2. 图片处理：对拍摄照片进行后期调色修图处理。3. 素材归档：完成当日拍摄照片的分类归档\n23 | 摄影岗 | 每周 | 1. 拍摄方案设计：根据下周需求设计拍摄方案和场景。2. 设备保养：维护摄影器材和灯光设备。3. 素材整理：整理归档本周拍摄素材\n24 | 摄影岗 | 每月 | 1. 产品图片库更新：更新维护产品图片库。2. 拍摄质量复盘：复盘月度拍摄质量并进行优化。3. 设备维护：摄影器材深度维护", "workStandards": "视觉负责人 / 渠道设计师 | DS-SOP-1 | 电商大促全渠道视觉设计执行 | 【流程说明】涵盖天猫/京东/拼多多/抖音全渠道大促视觉方案的标准化执行流程\n\n1. 活动方案对接：接收运营端大促活动方案，明确活动主题、核心利益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查各渠道已上线视觉内容是否符合VI规范  ←  6. 跨部门宣讲：向运营/品牌/市场等部门宣讲VI规范和设计协同流程  ←  5. 设计模板制作：基于VI规范制作各渠道设计模板和素材库\n                              ↓                              \n9. 竞品视觉追踪：追踪分析竞品品牌视觉策略和设计趋势  →  10. 规范迭代更新：根据品牌发展和市场变化定期迭代VI规范  →  11. 年度视觉审计：每年进行一次全渠道品牌视觉统一性审计  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 | DS-SOP-5 | 品牌展会/活动视觉物料设计管理 | 【流程说明】品牌线下展会和大型活动的视觉物料从策划到落地的全流程管理\n\n1. 展会需求确认：与品牌部确认展会基本信息(规模/展位尺寸/主题/预算)  →  2. 设计方案制定：制定展会/活动整体视觉设计方案(展位设计/物料清单)  →  3. 设计稿件输出：完成展会所有视觉设计稿件(背景墙/宣传折页/招贴立牌等)  →  4. 方案评审确认：组织品牌部/领导层设计方案评审，确认最终方案\n                              ↓                              \n8. 搭建安装执行：展前完成展位搭建和物料安装  ←  7. 物料到货验收：物料到货后验收质量和数量，确认无误  ←  6. 物料制作跟进：跟进物料制作进度(制作工期久的每周跟进，短的2-3天跟进)  ←  5. 物料供应商筛选：筛选物料制作供应商，进行询价比价\n                              ↓                              \n9. 现场效果确认：开展当日检查整体视觉效果，确保品牌形象完整呈现  →  10. 撤展与物料回收：展会结束后撤展和可回收物料整理  →  11. 费用核算归档：完成展会费用核算、供应商评价、设计素材归档  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n产品策划 | DS-SOP-6 | 新品详情页标准内容制作 | 【流程说明】新品上市前产品详情页内容的标准制定和制作流程\n\n1. 新品信息获取：从产品经理获取新品完整信息(配方/功效/成分/定位/定价)  →  2. 竞品内容分析：收集对标竞品的详情页内容表达模式和卖点宣称  →  3. 产品卖点提炼：与研发/产品经理沟通确认核心卖点和技术支撑点  →  4. 内容方案制定：制定产品详情页内容方案(产品介绍/功效说明/成分解读/使用场景)\n                              ↓                              \n8. 设计稿件审核：审核设计稿中的产品信息、功效表达是否准确无误  ←  7. 设计方案输出：向设计团队输出详情页设计方案和设计要求  ←  6. 文案撰写优化：撰写产品详情页文案，确保表述妥当、违禁词0  ←  5. 法规合规检查：对照《化妆品功效宣称评价规范》检查卖点表述合规性\n                              ↓                              \n9. 多部门确认：与研发/产品经理/运营沟通确认内容无误、表述妥当  →  10. 上架检查：上架后检查详情页在产品详情页的实际展示效果  →  11. 效果跟踪优化：跟踪详情页转化率，根据数据反馈持续优化内容  →  12. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌内容策划 / 摄像岗 / 摄影岗 | DS-SOP-7 | 品牌视频/摄影项目全流程制作 | 【流程说明】品牌视 益点和视觉需求  →  2. 视觉方向确定：根据活动主题确定整体视觉风格、主色调、视觉元素  →  3. 设计排期制定：根据活动上线时间倒推设计排期，分配各渠道设计任务  →  4. 创意方案提报：输出视觉创意方案（含首页/主图/推广图/直播背景风格方向稿）\n                              ↓                              \n8. 活动上线检查：检查活动主图详情配置是否正确、利益点展示是否准确  ←  7. 定时投放发布：按活动时间节点完成各渠道视觉素材的定时投放和发布  ←  6. 运营审核修改：提交运营端审核，根据反馈意见修改优化  ←  5. 设计稿件制作：按排期完成首页、二级页、主图、推广图等核心视觉设计\n                              ↓                              \n9. 活动效果复盘：活动结束后统计各渠道视觉点击率和转化数据  →  10. 设计素材归档：将活动期间所有设计源文件和成品归档至共享盘  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n渠道设计师 | DS-SOP-2 | 日常渠道视觉需求响应与制作 | 【流程说明】渠道日常视觉需求的标准化接收、制作和交付流程\n\n1. 需求接收登记：接收各渠道运营提交的视觉设计需求，录入需求登记表  →  2. 需求优先级判定：根据紧急程度(日常/紧急/大促)和渠道重要性确定优先级  →  3. 设计排期确认：根据当前工作量确认设计排期(日常24h内完成)  →  4. 视觉稿设计制作：按照品牌设计规范和渠道规范进行视觉设计\n                              ↓                              \n8. 终审确认上线：运营终审确认后完成素材上传或定时发布  ←  7. 修改优化完善：根据反馈意见进行修改(修改次数不超过3轮)  ←  6. 提交运营审核：提交运营端审核，收集修改意见  ←  5. 初审自查：完成设计稿后进行规范自查(违禁词/信息准确/格式正确)\n                              ↓                              \n9. 素材归档备份：将设计源文件和成品按要求归档保存  →  10. 需求完成统计：更新需求登记表，标记完成状态和耗时  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\nDS-SOP-3 | 天猫/京东全量商品主图及推广图制作 | 【流程说明】全量商品主图和主推商品推广图的定期更新和标准化制作流程\n\n1. 主图需求收集：收集各渠道全量商品主图和推广图更新需求  →  2. 产品信息确认：与运营确认产品信息(价格/机制/卖点/活动标签)  →  3. 主图模板选择：根据产品类型和渠道选择对应的主图设计模板  →  4. sku图批量制作：按排期完成sku图的批量制作和优化\n                              ↓                              \n8. 素材审核提交：检查素材图是否审核通过，提交平台审核  ←  7. 视频进链接切换：手动切换详情页视频链接  ←  6. 详情页视觉更新：与产品策划协作更新详情页视觉内容  ←  5. 搜索主图优化：优化搜索主图和sku搜索标题视觉呈现\n                              ↓                              \n9. 投放效果监测：监测主图投放后的点击率变化  →  10. 模板迭代优化：根据点击率数据优化主图设计模板  →  11. 结束 | （来自标准化推进-平面设计师 SOP 标准化梳理）\n品牌设计师 / AI设计师 | DS-SOP-4 | 品牌VI规范输出与视觉统一管控 | 【流程说明】品牌视觉规范体系的建立、更新和全渠道统一性管控流程\n\n1. 品牌视觉诊断：根据品牌发展现状诊断视觉体系存在的问题和改进空间  →  2. VI规范制定：制定/优化品牌VI视觉输出规范(Logo/配色/字体/排版/版式)  →  3. 规范手册编制：编制品牌VI视觉应用规范手册(电子版+打印版)  →  4. 团队培训传达：组织设计团队VI规范培训，确保全员理解掌握\n                              ↓                              \n8. 违规内容整改：发现不符合VI规范的内容限期整改(优先级:品牌>渠道)  ←  7. 视觉统一检查：定期检查
